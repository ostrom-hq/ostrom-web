# Included by every location that sets its own headers (nginx does not inherit add_header into such a location).
# vite.config.ts serves the same headers on `vite preview`, so the Playwright journeys run under this exact policy:
# keep one `add_header <Name> "<value>" always;` per line.
#
# Content-Security-Policy (audit S2-09): scripts and styles from this origin only, never inline nor eval (index.html has
# no inline script, zod runs jitless). connect-src: the API on this origin (fetch, SSE, the terminals' WebSocket) and
# the PostHog origin when product analytics are on ($ostrom_csp_connect_extra, written by 40-ostrom-config.sh).
# require-trusted-types-for 'script' (audit AUDIT-SECU-WEB-2 B4): no string reaches an HTML or script sink
# (innerHTML, a script's src…); the console has none, and one added later is refused by the browser, not run.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' $ostrom_csp_connect_extra; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; require-trusted-types-for 'script'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# A page this one opens (a link to GitHub, an artifact) gets no handle on it, and it none on them (audit B4).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
