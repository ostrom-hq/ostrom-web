      properties:
        kind:
          type: string
        id:
          type: string
        url:
          type: string
        title:
          type: string
      required:
      - kind
    WaitSpec:
      type: object
      description: The question of a wait node, or of a wait asked by an agent (TeamCode `ask_human`)
      properties:
        title:
          type: string
        body:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/WaitField'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/WaitAction'
        refs:
          type: array
          items:
            $ref: '#/components/schemas/WaitRef'
      required:
      - title
    WaitStatus:
      type: string
      enum:
      - open
      - resolved
      - cancelled
    Webhook:
      type: object
      description: An outgoing webhook
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        createdAt:
          type: string
      required:
      - id
