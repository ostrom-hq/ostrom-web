            type: string
        commitDetails:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalCommit'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalCheck'
        requestedFrom:
          type: string
        channel:
          type: string
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        decidedBy:
          type: string
        decidedAt:
          type: string
        shownDigest:
          type: string
        askedBy:
