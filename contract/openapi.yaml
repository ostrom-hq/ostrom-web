          type: boolean
        canApprove:
          type: boolean
          description: "Whether the person may answer: their role, being an approver, not their own gate. It does not
            wait for a fresh sign-in or the phone's unlock: a locked app reads `true`, and its yes is refused at the
            answer with 403 `step_up_required` until `unlockMobileApp` (planned: for a high-risk yes, an unlock
            bound to this approval, `unlockMobileApp.requestId`)"
        reason:
          type: string
        reasonType:
          type: string
          enum: [github_link_required, self_approval_refused]
          x-ostrom-status: planned
          description: "The key of `reason` when the server names one, the `error.type` the answer would get:
            `github_link_required` when the caller must link their GitHub account before a yes (a never-self-approve
            policy, and a pull request whose author linked no Ostrom person; a no stays open), `self_approval_refused`
            when their linked GitHub account is the pull request's author. Absent for any other reason. Planned: the
            server does not send it yet"
        selfApproval:
          type: boolean
      required:
