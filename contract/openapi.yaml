          description: What "done" means, at most 1 000 characters
        checks:
          type: array
          description: At least one typed check
          items:
            $ref: '#/components/schemas/TodoCheck'
      required:
      - text
      - checks
    TodoCheck:
      description: "One typed check of an end condition, told apart by `type`. A check is read again at every stop, so it
        must stay true once the work moves on (never a transient state such as a PR still open); no check names a PR
        number or a version. `pr_merged`, `pr_closed`, `release_contains`, `ci_green` (with `gh`) and `command` (in a
        shell) run on the agent's machine; `artifact_published` and `wait_answered` are verified by the server through
        the item's links; `attested` is the agent's word, the last resort. A client shows a `type` it does not know as
        text"
      oneOf:
      - $ref: '#/components/schemas/TodoCheckPrMerged'
      - $ref: '#/components/schemas/TodoCheckPrClosed'
      - $ref: '#/components/schemas/TodoCheckReleaseContains'
      - $ref: '#/components/schemas/TodoCheckCiGreen'
      - $ref: '#/components/schemas/TodoCheckCommand'
      - $ref: '#/components/schemas/TodoCheckArtifactPublished'
      - $ref: '#/components/schemas/TodoCheckWaitAnswered'
      - $ref: '#/components/schemas/TodoCheckAttested'
      discriminator:
        propertyName: type
        mapping:
          pr_merged: '#/components/schemas/TodoCheckPrMerged'
          pr_closed: '#/components/schemas/TodoCheckPrClosed'
          release_contains: '#/components/schemas/TodoCheckReleaseContains'
          ci_green: '#/components/schemas/TodoCheckCiGreen'
          command: '#/components/schemas/TodoCheckCommand'
          artifact_published: '#/components/schemas/TodoCheckArtifactPublished'
          wait_answered: '#/components/schemas/TodoCheckWaitAnswered'
          attested: '#/components/schemas/TodoCheckAttested'
    TodoCheckPrMerged:
      type: object
      description: "The item's pull request (linked, or found by its marker among the PRs of the token's login) is merged"
      properties:
        type:
          type: string
          const: pr_merged
        repo:
          type: string
          description: "`owner/name`"
      required:
      - type
      - repo
    TodoCheckPrClosed:
      type: object
      description: "The item's pull request is closed without merge, for the stated reason"
      properties:
        type:
          type: string
          const: pr_closed
        repo:
          type: string
        reason:
          type: string
          description: At most 1 000 characters
      required:
      - type
      - repo
      - reason
    TodoCheckReleaseContains:
      type: object
      description: "The earliest published, non-draft release of `repo` whose tag is at or ahead of the merge commit of
        the item `of` (or of `commit`); it is linked to the item with its tag"
      properties:
        type:
          type: string
          const: release_contains
        repo:
          type: string
        of:
          type: string
          description: The id of the item whose pull request's merge commit the release must contain
        commit:
          type: string
      required:
      - type
      - repo
    TodoCheckCiGreen:
      type: object
      description: "Every workflow run of `repo` on the merge commit of the item `of` (or on `ref`) completed green; none
        yet, running or failed is not done"
      properties:
        type:
          type: string
          const: ci_green
        repo:
          type: string
        of:
          type: string
        ref:
          type: string
        workflow:
          type: string
          description: Only the runs of this workflow
      required:
      - type
      - repo
    TodoCheckCommand:
      type: object
      description: "A command run on the agent's machine (`sh -c`, `cmd /c` on Windows) exits with `expectExit`. `run`
        may cite `${pr:<item>.number}`, `${pr:<item>.mergeSha}` and `${release:<item>.tag}`, replaced from the links; a
        value not linked yet leaves the check unknown. Output bounded to 300 characters and masked"
      properties:
        type:
