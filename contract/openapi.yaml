      description: "Asked by the Stop hook (`ostrom hook todo-stop`) up to three times per stop. `begin` answers `allow`
        (`why`: `no_list`; `hook_disabled` when an administrator turned the hook off for the session's owner,
        before anything is run or written; `finished`; `background_task`; `wait_open` when any wait of the
        session is open) or `verify`. On `verify` the hook runs the checks of the item in progress (a `command`
        too, at most 120 s) and of every `todo` item whose checks are all cheap (`pr_merged`, `release_contains`,
        `artifact_published`, `wait_answered`), reads the transcript for the pull requests the session opened
        (`orphans`), and sends their outcome: the server ticks what passed, verifies `artifact_published` and
        `wait_answered` itself, adds each orphan PR no item covers as a `discovered` item \"Finish PR #n\"
        ending on `pr_merged`, counts the stop and answers `settle` (every item is done or dropped), `block`
        (`reason`: the resume message for the agent, at most 8 000 characters) or `allow`. On `settle` the hook
        re-runs every check of the done items: all hold, the list is `done` and the answer `allow` (`settled`);
        else a regressed item is reopened and the stop blocked; an `attested` check never reopens an item. The
        third blocked stop in a row with no item finished, added or noted opens a wait for the owner
        (\"Blocked: …\", Resume / Drop this item / Stop here), resets the counter and answers `allow`
        (`escalated`). The hook fails open and reports its failures with `recordTodoHookError`. 400
