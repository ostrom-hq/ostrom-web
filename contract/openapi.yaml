  /api/v1/gates/{id}:
    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    get:
      operationId: getGate
      x-ostrom-status: served
      tags:
      - gates
      summary: A gate request; `wait` long-polls up to that many seconds for an answer
      description: |-
        With `wait`, a pending gate is waited on for its answer: the response comes as soon as the gate is no longer
        pending, or with it still pending when the wait ends; the caller then asks again. A gate that is not pending
        answers at once, and so does another organization's gate or launch's (404, 403). The server caps the wait at
        30 seconds and reads a value outside 0 to 30 as the nearest bound. A waiting request holds no database
        connection. A client sets its HTTP timeout above the wait.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: wait
        in: query
        required: false
        description: Seconds to wait on a pending gate for its answer; absent or 0 reads at once.
        schema:
          type: integer
          minimum: 0
          maximum: 30
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
