        the same transaction, with every tool, and nobody else reaches it (an administrator cannot assign or save it: 409
        `mcp_server_personal`). The body is a team server's; `owner` is set by the server, a value sent is ignored.
        Reads take `mcp:read`, writes `mcp:admin` on a token (the same scopes as the team's routes). `secretNames` name the caller's own personal secrets. Its
        name shares the organization's namespace: a team server or another member's personal one of the same name is
        409 (names are not private within an organization, as for team servers). A remote HTTPS server is allowed under the same upstream address checks as a team server. A hosted stdio
        command runs package code on the server's MCP host: refused with 403 `hosted_not_allowed` unless an
        administrator turned `memberHostedMcp` on (`putMcpSettings`, off by default); then the launcher and exact-version
        rules are a team command's, and its process is always the member's own (`per-member`). At most 20 per member
        (409 `mcp_server_limit`); they do not count in the team's 64. From the console (step-up). Journaled
        `mcp.server.personal.created`"
