    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    post:
      operationId: makeSharedAccountAccessOnly
      x-ostrom-status: served
      tags:
      - sharing
      summary: Serve an imported account with its access token only, never renewing it (admins)
      description: "TeamCode's access-only trial mode: the account serves with the access token it holds and is never renewed (`refreshOwnership` `access_only`), so the source that renews it keeps working. Once the access token is within 5 minutes of its expiry the account serves nothing until it is imported again with fresh tokens (or handed over). Same callers and answers as the handover; 409 `account_refreshing` while a refresh is in flight. Served under `sharing.handover.v1`."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
