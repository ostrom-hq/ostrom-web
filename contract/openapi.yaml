        in: query
        required: false
        description: "The final run, once TeamCode is stopped: owners only (403 `cutover_owner_required` otherwise), recorded in the audit log in the name of the person who runs it, before anything is written (503 `cutover_audit_unavailable` on a server without an audit log, 503 `cutover_sharing_unavailable` on a server without shared accounts; the key is `error.type`). It also revives the shared accounts waiting for a reconnection, testing TeamCode's tokens first (renewing rotates them, so a normal run never does)."
        schema:
          type: boolean
      - name: accessOnly
        in: query
        required: false
        description: "TeamCode's `--access-only` trial (`sharing.handover.v1`): the accounts the import creates, and
          those still waiting for their handover, serve with TeamCode's access tokens and are never renewed by Ostrom
          (`refreshOwnership` `access_only`), so TeamCode keeps renewing its own copy; run the import again when they
          expire. Accounts Ostrom already renews are left alone. Not with `cutover` (400). Without it, a normal run
          leaves the accounts it creates waiting for a handover (`pending_handover`), refreshes the tokens of the
          accounts still waiting with TeamCode's current ones, and the cutover run hands every waiting account over
