    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    post:
      operationId: cancelInferenceRequest
      x-ostrom-status: served
      tags:
      - inference
      summary: Stop one of the caller's inference calls by its `x-ostrom-client-request-id` (`inference.cancel.v1`)
      description: "Leaves a cancellation marker every replica reads: the call with that id, of the same member, stops
        within about half a second wherever it runs (waiting in the queue, between accounts, or streaming), and a call
        that arrives after the marker stops before it starts. 204 acknowledges the marker, also for an id no call
        carries (it does not tell whether a call exists), never that the provider stopped or that anything is
        refunded. Idempotent: sending it again changes nothing. A marker lasts 10 minutes; at most 256 per member and
        4,096 per organization, past which 503 `cancellation_limit`. The same credentials as the inference endpoints
        (an agent session, `inference:use`); a call of another member is never touched"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      responses:
        '204':
          description: The marker is stored
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
