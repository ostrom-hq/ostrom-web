        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  description: "What the key may do, from the catalogue below; any other scope, 400. CI scopes (a key
                    acting for the organization, each call audited as `service_key.used`): `sessions:write` (reportCheck,
                    signWorkflowReceipt), `rules:read` (listRules, getRule). Member scopes (the key then acts as the
                    person who created it, within the scope, and never as an admin): `inference:use` (the inference
                    gateway), `mcp:use` (the relayed MCP servers), `usage:read` (the creator's own usage),
                    `cloud:read` and `cloud:write` (the creator's own cloud sessions; write includes read),
                    `artifacts:read` and `artifacts:write` (the artifacts the creator can read; write includes read),
                    `skills:read` and `hooks:read` (the skills and team hooks delivered to the creator, `skills.v1` and
                    `hooks.v1`), `memory:use` (the organization's memory and the creator's personal entries,
                    `memory.v1`).
                    Reserved to an owner or an admin, and only while its creator still is one, checked at every call:
                    `team:read` (a read-only view of the organization: usage, spending, budgets, accounts, MCP usage and
                    the member directory, no session, transcript or artifact of a member) and `cloud:admin` (cloud:write
                    with an administrator's rights over every cloud session of the organization), `skills:publish` (publish skill
                    versions, `publishSkillVersion`), `skills:pin` (with `skills:publish`: pin at publication or with
                    `pinSkill`), `skills:assign` (with `skills:publish`: deliver to all members at publication) and
                    `hooks:publish` (publish hook versions, which only an administrator pins). The CI scopes cannot
                    be mixed with the others (400). A key stops working as soon as its creator leaves the organization.
                    A server that serves the wide catalogue lists `servicekeys.scopes.v1` in its capabilities; an older
                    one accepts only the CI scopes. A key is refused on every operation its scopes do not open,
                    whatever it holds."
                  items:
                    type: string
                expiresInDays:
                  type: integer
                  description: Lifetime in days, 1 to 366; absent for a key that does not expire
              required:
