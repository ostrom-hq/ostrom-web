          $ref: '#/components/responses/Error'
    put:
      operationId: setBudget
      x-ostrom-status: served
      tags:
      - budgets
      summary: Set a budget (the organization, every member, or one member)
      description: "Replaces the subject's limits whole: a monthly one (`usdPerMonth`) and a daily one (`usdPerDay`),
        both stopping the calls (`hardStop` true) or both only warning (false); neither amount removes the subject's
        limits. The subject is the organization (`scope` `organization`), every member without limits of their own
        (`member` without `subject`), or one member (`member`, `subject` = the member's `id` from
        `/api/v1/orgs/{org}/members`). A workflow budget is not served: `scope` `workflow` is a 400.
        Written by a browser session. Planned (Q-CLI-BUDGETS): also by the token of `ostrom login --admin` that
        holds `budgets:write`, as a governance write: never applied directly, held until an owner or an admin
        confirms it on the console (202, `kind` `budgets.set`, `credential` `admin`), like `setModelPolicy`; the
        same body asked again by the same person while it waits answers the same confirmation. Its `before` is the
        subject's own `Budget` as `listBudgets` shows it, JSON null when it has none (a member who only follows the
        limits of every member); its `after` is the `Budget` written, JSON null when the write removes the limits.
        No other credential writes a budget, a service key included (403)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Budget'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '202':
          $ref: '#/components/responses/GovernanceConfirmationPending'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
