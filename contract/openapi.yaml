          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOverview'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/orgs/{orgId}/billing/resume:
    post:
      operationId: resumeBillingSubscription
      x-ostrom-status: planned
      tags:
      - billing
      summary: Keep a subscription that was set to end
      description: 'Owners, admins and billing admins. 409 if the subscription is not ending; a subscription already ended is bought again through checkout.'
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingOverview'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/orgs/{orgId}/billing/invoices:
    get:
      operationId: listBillingInvoices
      x-ostrom-status: planned
      tags:
      - billing
      summary: Invoices and receipts, newest first
      description: 'Owners, admins and billing admins. Empty for an organization that never bought.'
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 24
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoiceList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      x-ostrom-status: planned
      tags:
      - billing
      summary: Stripe events (subscriptions, invoices, checkout)
      description: 'Called by Stripe only, authenticated by the `Stripe-Signature` header (HMAC-SHA256 of the timestamp and
        the body, 5 minutes of tolerance). Each event is applied once; a replay answers `duplicate`. Bodies over 256 KiB
        are refused (413).'
      security: []
      parameters:
      - name: Stripe-Signature
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Stripe event, as Stripe sends it
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingWebhookAck'
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An Ostrom token (CLI, app, device, runner or service key)
    sessionCookie:
      type: apiKey
      in: cookie
      name: ostrom_session
      description: 'The browser session of the console: HttpOnly, Secure, SameSite=Lax, Path=/. Set by a sign-in, never
        carried in a body, a URL or a redirect. With it, every POST, PUT, PATCH and DELETE also sends the `X-CSRF-Token`
        header, equal to the readable `ostrom_csrf` cookie set beside it; otherwise 403. Sign-out expires both cookies.'
  responses:
    Error:
      description: A refusal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ActivityActor:
      type: object
      description: Who did it
      properties:
        kind:
          type: string
        name:
          type: string
      required:
      - kind
      - name
      x-ostrom-kotlin: pending
    ActivityItem:
      type: object
      description: 'A line of the activity feed (kind: session.started, session.ended, gate.requested, gate.decided, check.passed,
        check.failed, workflow.changed; clients keep an unknown kind as UNKNOWN)'
      properties:
        id:
          type: string
        at:
          type: string
        kind:
          type: string
        actor:
          $ref: '#/components/schemas/ActivityActor'
        summary:
          type: string
        repo:
          type: string
        costUsd:
          type: number
        approvalId:
          type: string
        gateId:
          type: string
        sessionId:
          type: string
      required:
      - id
      - at
      - kind
      - actor
      - summary
      x-ostrom-kotlin: pending
    AgentEvent:
      type: string
      enum:
      - SessionStart
      - UserPromptSubmit
      - PreToolUse
      - PostToolUse
      - Stop
      - SessionEnd
    AnalysisState:
      type: object
      description: Snapshot of the organization analysis
      properties:
        phase:
          type: string
        progress:
          type: number
        repos:
          type: array
          items:
            $ref: '#/components/schemas/Repo'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
        failure:
          type: object
          additionalProperties:
            type: string
      required:
      - repos
      - rules
      - workflows
      x-ostrom-kotlin: pending
    AnswerApprovalRequest:
      type: object
      description: 'Answers an approval. The answer is refused (409) when [shownDigest] is not the digest of what the approval
        shows now:'
      properties:
        answer:
          $ref: '#/components/schemas/ApprovalAnswer'
        shownDigest:
          type: string
        note:
          type: string
      required:
      - answer
      - shownDigest
    ApiError:
      type: object
      description: The error body of every refusal
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    Approval:
      type: object
      description: 'A request for a yes, shown to an approver. It is bound to what was shown: [shownDigest] is the digest
        of the title,'
      properties:
        id:
          type: string
        group:
          type: string
        workflowId:
          type: string
        taskId:
          type: string
        title:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        repo:
          type: string
        sha:
          type: string
        commits:
          type: array
          items:
            type: string
        commitDetails:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalCommit'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalCheck'
        requestedFrom:
          type: string
        channel:
          type: string
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        decidedBy:
          type: string
        decidedAt:
          type: string
        shownDigest:
          type: string
        askedBy:
          type: array
          items:
            type: string
        selfApproved:
          type: boolean
        expiresAt:
          type: string
        action:
          $ref: '#/components/schemas/ApprovalAction'
        diffStats:
          $ref: '#/components/schemas/DiffStats'
        diffTruncated:
          type: boolean
          description: The approver is not shown the whole diff; the app then refuses a mobile yes
      required:
      - id
      - title
      - requestedFrom
      - channel
      - status
      - shownDigest
    ApprovalAction:
      type: object
      description: 'The action a yes lets through. With `commitDetails`, `checks`, `diffStats` and `diffTruncated`, it is
        the proof an approver is shown (decision of 30/10 04:10)'
      properties:
        kind:
          $ref: '#/components/schemas/ApprovalActionKind'
        repo:
          type: string
        ref:
          type: string
        headSha:
          type: string
        baseSha:
          type: string
        risk:
          $ref: '#/components/schemas/ApprovalActionRisk'
      required:
      - kind
      - repo
      - ref
      - headSha
      - risk
    ApprovalActionKind:
      type: string
      description: The kind of action (clients keep an unknown kind as UNKNOWN)
      enum:
      - push
      - merge
      - deploy
      - tool
      - other
    ApprovalActionRisk:
      type: string
      description: A high risk needs biometrics for a mobile yes
      enum:
      - low
      - high
    ApprovalAnswer:
      type: string
      enum:
      - approve
      - reject
    ApprovalCallerView:
      type: object
      description: What the caller may do with an approval
      properties:
        login:
          type: string
        self:
          type: boolean
        canApprove:
          type: boolean
        reason:
          type: string
        selfApproval:
          type: boolean
      required:
      - login
      - self
      - canApprove
      x-ostrom-kotlin: pending
    ApprovalCheck:
      type: object
      description: A CI check shown with an approval
      properties:
        name:
          type: string
        state:
          $ref: '#/components/schemas/CheckState'
        url:
          type: string
      required:
      - name
      - state
    ApprovalCommit:
      type: object
      description: A commit shown with an approval
      properties:
        sha:
          type: string
        title:
          type: string
        author:
          type: string
        url:
          type: string
      required:
      - sha
      - title
    ApprovalQueue:
      type: object
      description: The yes queue of the caller
      properties:
        operator:
          type: string
          description: Login a yes is signed as
        you:
          $ref: '#/components/schemas/ApprovalViewer'
        pending:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalView'
        recent:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalView'
      required:
      - operator
      - you
      - pending
      - recent
      x-ostrom-kotlin: pending
    ApprovalStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - expired
    ApprovalView:
      type: object
      description: 'An approval as the console and the app show it: the request, the gate, the rules, the commits and checks
        (in `approval`), the receipt once answered'
      properties:
        approval:
          $ref: '#/components/schemas/Approval'
        who:
          type: object
          properties:
            dev:
              type: string
            agent:
              type: string
            model:
              type: string
            session:
              type: string
        what:
          type: object
          properties:
            action:
              type: string
            command:
              type: string
            repo:
              type: string
            sessionRepo:
              type: string
            harness:
              type: string
        gate:
          $ref: '#/components/schemas/GateRef'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        diff:
          type: string
        pr:
          $ref: '#/components/schemas/GatePullRequest'
        askedVia:
          type: array
          items:
            type: string
        note:
          type: string
          description: What the approver told the agent with the answer
        receipt:
          $ref: '#/components/schemas/Receipt'
        verification:
          $ref: '#/components/schemas/Verification'
        you:
          $ref: '#/components/schemas/ApprovalCallerView'
      required:
      - approval
      - you
      x-ostrom-kotlin: pending
    ApprovalViewer:
      type: object
      description: Who is looking at the yes queue
      properties:
        login:
          type: string
        via:
          type: string
          description: '`console`, `app`, `cli`, `operator-account`'
        name:
          type: string
      required:
      - login
      - via
      x-ostrom-kotlin: pending
    ApproverGate:
      type: object
      description: A gate seen from its approvers, with the actions it covers
      properties:
        workflowId:
          type: string
        workflowName:
          type: string
        nodeId:
          type: string
          description: The gate node
        label:
          type: string
        enforce:
          type: boolean
          description: False while the workflow is only proposed
        actions:
          type: array
          description: The action classes it covers (`push-main`, `deploy`…), sorted
          items:
            type: string
      required:
      - workflowId
      - workflowName
      - nodeId
      - label
      - enforce
      - actions
    ApproverLine:
      type: object
      description: One approver and the gates they answer
      properties:
        approver:
          type: string
          description: The approver, as the workflow names them
        gates:
          type: array
          description: Their gates, by workflow then node
          items:
            $ref: '#/components/schemas/ApproverGate'
      required:
      - approver
      - gates
    ApproversGraph:
      type: object
      description: Who approves what in a repository, the gates catalogue seen from the approvers' side
      properties:
        approvers:
          type: array
          description: Every approver, sorted by name
          items:
            $ref: '#/components/schemas/ApproverLine'
        unanswered:
          type: array
          description: The gates that name no approver; their actions can never run
          items:
            $ref: '#/components/schemas/ApproverGate'
        ungated:
          type: array
          description: The action classes no gate covers, sorted
          items:
            type: string
      required:
      - approvers
      - unanswered
      - ungated
    Artifact:
      type: object
