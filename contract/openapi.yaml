      properties:
        webhook:
          $ref: '#/components/schemas/Webhook'
        secret:
          type: string
          description: '`whsec_…`; store it now, it is never readable again'
      required:
      - webhook
      - secret
    CreateWebhookRequest:
      type: object
      properties:
        url:
          type: string
        types:
          type: array
          items:
            type: string
        description:
          type: string
      required:
      - url
      - types
    UpdateWebhookRequest:
      type: object
      properties:
        version:
          type: integer
        url:
          type: string
        types:
          type: array
          items:
            type: string
        description:
          type: string
        enabled:
          type: boolean
          description: Absent keeps the current state
      required:
      - version
      - url
      - types
    WebhookDelivery:
      type: object
      description: One event for one webhook, and its attempts
      properties:
        id:
          type: string
          description: Also the `Ostrom-Delivery` header
        eventSeq:
          type: integer
          format: int64
          description: The event's `seq`; absent for a test
        eventType:
          type: string
        state:
          type: string
          description: '`pending`, `delivered` or `failed`'
        attempts:
          type: integer
        nextAttemptAt:
          type: string
          description: While pending
        lastStatus:
          type: integer
          description: The last HTTP status the receiver answered
        lastError:
          type: string
          description: '`timeout`, `connect`, `tls`, `dns`, `host_not_allowed`, `secret_unreadable` or `expired`'
        createdAt:
          type: string
        deliveredAt:
          type: string
        test:
          type: boolean
      required:
      - id
      - eventType
      - state
      - attempts
      - createdAt
      - test
    WebhookDeliveryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
      required:
      - items
    WorkflowPage:
      type: object
      description: "The workflows; `next` is the cursor of the following page"
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
        next:
          type: string
      required:
      - items
    Workflow:
      type: object
      description: A workflow
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        description:
          type: string
        version:
          type: integer
        repos:
          type: array
          description: 'Repositories the workflow applies to, `owner/name` where `*` is any part of a name (1 to
            100). Absent: every repository of the organization, as before. Present: these only, whether the workflow
            is observed or enforced, in the session packages and the gates catalogue'
          items:
            type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdge'
        start:
          type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInput'
        sessionMode:
          type: string
          description: "`same`: the agent steps of a run are messages of one session; `handoff` (when absent): each
            agent step starts a session whose first message carries what the earlier steps delivered"
        limits:
          $ref: '#/components/schemas/WorkflowLimits'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/RuleSource'
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        foundAt:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: string
      required:
      - id
      - name
      - domain
      - nodes
      - edges
      - status
      - foundAt
    WorkflowEdge:
      type: object
      description: An edge. For a run, [on] is the outcome that follows it (`next`, `delivered`, a wait action id, `true`
        or `false` out of a check node with a condition, which has no default); [to] null ends
      properties:
        from:
          type: string
        to:
          type:
          - string
          - 'null'
        label:
          type: string
        'on':
          type: string
      required:
      - from
      - to
    WorkflowEditors:
      type: object
      description: Who may decide workflows besides owners and admins
      properties:
        mode:
          type: string
          description: "`all`, `admins` (the default) or `members`"
        memberIds:
          type: array
          description: The members who may, with `members` (`Member.id`)
          items:
            type: string
      required:
      - mode
    WorkflowInput:
      type: object
      description: An input of a workflow run
      properties:
        id:
          type: string
        label:
          type: string
        required:
          type: boolean
        default:
          type: string
        maxLength:
          type: integer
      required:
      - id
      - label
    WorkflowLimits:
      type: object
      description: "The bounds of a run of the workflow: `maxNodes` (50, at most 100), `maxVisits` in all (100, at most
        500), `maxDepth` of sub-workflows (3, at most 5)"
      properties:
        maxNodes:
          type: integer
        maxVisits:
          type: integer
        maxDepth:
          type: integer
    WorkflowNode:
      type: object
      description: A workflow node
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/WorkflowNodeKind'
        label:
          type: string
        detail:
          type: string
        owner:
          type: string
        approvers:
          type: array
          items:
            type: string
        approverReason:
          type: string
        when:
          $ref: '#/components/schemas/NodeWhen'
        ruleIds:
          type: array
          items:
            type: string
        position:
          $ref: '#/components/schemas/NodePosition'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/GateAction'
        actionsBy:
          type: string
        actionsAt:
          type: string
        run:
          $ref: '#/components/schemas/NodeRun'
        suggested:
          $ref: '#/components/schemas/NodeSuggestions'
        wait:
          $ref: '#/components/schemas/WaitSpec'
        workflowId:
          type: string
          description: "The workflow a `workflow` node runs: a child run of another accepted workflow of the
            organization, with `arguments` as its inputs. A run never calls a workflow already running above it, and
            runs nest at most 5 deep: the visit fails then, and the run ends `failed`, with the reason in `failure`
            (no HTTP error: the call is checked when the run reaches it, since the called workflow may change after
            it is saved)"
        arguments:
          type: object
          additionalProperties:
            type: string
        maxVisits:
          type: integer
        condition:
          $ref: '#/components/schemas/NodeCondition'
      required:
      - id
      - kind
      - label
    WorkflowNodeKind:
      type: string
      enum:
      - trigger
      - step
      - check
      - gate
      - notify
      - agent
      - wait
      - workflow
    WorkflowPendingDeliverable:
      type: object
      description: The form of a pending deliverable, never its schema
      properties:
        type:
          type: string
        domain:
          type: string
      required:
      - type
    WorkflowRunPage:
      type: object
      description: "A page of workflow runs, newest first; `next` is the cursor of the following page"
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRun'
        next:
          type: string
      required:
      - items
    WorkflowRun:
      type: object
      description: A workflow run
      properties:
        id:
          type: string
        workflowId:
          type: string
        workflowName:
          type: string
        workflowVersion:
          type: integer
        status:
          $ref: '#/components/schemas/RunStatus'
        startedBy:
          type: string
        source:
          type: string
        automationId:
          type: string
        inputs:
          type: object
          additionalProperties:
            type: string
        currentNodeId:
          type: string
        currentNodeKind:
          $ref: '#/components/schemas/WorkflowNodeKind'
        parentRunId:
          type: string
        sessionId:
          type: string
        repository:
          type: string
          description: The repository of the agent nodes that name none
        visits:
          type: array
          items:
            $ref: '#/components/schemas/NodeVisit'
        failure:
          type: string
        failureCode:
          type: string
          description: "A stable code: `session_failed`, `session_deleted`, `session_missing`, `ended_without_delivery`,
            `repository_missing`, `starter_unavailable`, `wait_cancelled`, `wait_missing`, `max_visits:<node>`,
            `max_total_visits`, `max_depth`, `workflow_missing`, `invalid_arguments`, `sub_workflow_failed`,
            `sub_workflow_cancelled`, `expired`, `no_transition`, or the code of a refusal that cannot be retried"
        output:
          type: string
        receiptId:
          type: string
        startedAt:
          type: string
        endedAt:
          type: string
      required:
      - id
      - workflowId
      - workflowName
      - workflowVersion
      - status
      - startedBy
      - source
      - startedAt
    WorkflowSessionPending:
      type: object
      description: Whether a session's agent step still waits for its delivery (`pendingWorkflowSession`)
      properties:
        needsAction:
          type: boolean
        runId:
          type: string
        nodeTitle:
          type: string
        deliverable:
          $ref: '#/components/schemas/WorkflowPendingDeliverable'
      required:
      - needsAction
    WorkflowSettings:
      type: object
      description: The editing rights of workflows, and the caller's
      properties:
        editors:
          $ref: '#/components/schemas/WorkflowEditors'
        canEdit:
          type: boolean
          description: Whether the caller may decide a workflow without a gate node
      required:
      - editors
      - canEdit
    WorkflowStatus:
      type: string
      description: "`rejected`: a proposal a person turned down, kept so the analysis never proposes it again; it
        compiles nothing and never runs"
      enum:
      - proposed
      - accepted
      - edited
      - rejected
