    post:
      operationId: handOverSharedAccount
      x-ostrom-status: served
      tags:
      - sharing
      summary: Give Ostrom refresh ownership of an imported account (admins)
      description: "TeamCode's refresh-ownership handover. An imported account waits (`refreshOwnership` `pending_handover`) because the source it came from may still renew its tokens, and a rotating refresh token sent by two refreshers disconnects the account. Once every other refresher has stopped, an owner or admin hands it over: `refreshOwnership` becomes `ostrom`, and the account serves and is renewed by Ostrom. Also takes over an `access_only` account. An account already owned is answered as it is. A member who is not an admin gets 403 `account_handover_forbidden` on an account they shared, 404 on any other; an account of another organization is 404. 409 `account_refreshing` while a refresh of the account is in flight. Never changes `status` or `paused`. Served under `sharing.handover.v1`."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The account after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedAccount'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
