      required:
      - id
      - at
      - event
      - actor
      - subject
      x-ostrom-kotlin: pending
    AuthSession:
      type: object
      description: A signed-in browser or device session
      properties:
        id:
          type: string
        createdAt:
          type: string
        lastSeenAt:
          type: string
        device:
          type: string
        current:
          type: boolean
      required:
      - id
      - createdAt
      - current
      x-ostrom-kotlin: pending
    AuthToken:
      type: object
      description: A token issued to a developer or a service
      properties:
        token:
          type: string
        login:
          type: string
        expiresAt:
          type: string
        scopes:
          type: array
          items:
            type: string
      required:
      - token
      - login
      - scopes
      x-ostrom-kotlin: pending
    AuthUser:
      type: object
      description: The signed-in person
      properties:
        login:
