      description: "TeamCode's `POST /api/v1/runs/{id}/activity` on Ostrom's session segment: the launch of
        `ostrom <agent>` reports from the agent's `Stop`, `Notification`, `UserPromptSubmit` and `PostToolUse` hooks,
