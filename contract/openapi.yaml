  /api/v1/runners/{id}/heartbeat:
    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    post:
      operationId: runnerHeartbeat
      x-ostrom-status: served
      tags:
      - runners
      summary: Sign of life; returns the work assigned
      description: >-
        Authenticated by the runner's own key (`Authorization: Bearer ostrom_runner_…`, from registerRunner's
        answer), not a member's credential. Marks the runner seen: listRunners shows it `online` for 90 seconds
        after its last heartbeat. An unknown runner, a malformed id, another runner's key or a runner removed
        meanwhile all answer 401 alike.

        A runner that runs cloud sessions (`ostrom-runner machine` with a Docker Engine, on a server whose sessions
        run on registered runners) sends a JSON body: the executions its machine has and the workspaces it holds.
        The answer is what it must hold: the executions to run, each handed over once with its plan (the volumes
        and containers to create, the last one holding the execution's runner token), and the workspaces to keep.
        Anything else of its own, it stops and deletes. A runner that sends no body is given nothing; an unknown
        state or a malformed session id answers 400. `sessions` is kept for older runners and stays empty.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                executions:
                  type: array
                  description: The executions the machine has, and those it is creating.
                  items:
                    type: object
                    properties:
                      sessionId:
                        type: string
                        format: uuid
                      epoch:
                        type: integer
                        format: int64
                      state:
                        type: string
                        enum: [pending, running, ended]
                    required: [sessionId, epoch, state]
                workspaces:
                  type: array
                  description: The sessions whose workspace volumes the machine holds.
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: '`no-store`: a plan holds a runner token.'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/CloudSession'
                  executions:
                    type: array
                    description: >-
                      The executions to run. A plan comes once, when the execution is handed over to this runner;
                      later answers name the execution without it.
                    items:
                      type: object
                      properties:
                        sessionId:
                          type: string
                          format: uuid
                        epoch:
                          type: integer
                          format: int64
                        plan:
                          type: object
                          description: >-
                            The Docker Engine objects to create, in order: the session's volumes, then the
                            execution's containers, each with its Engine API creation body.
                          properties:
                            volumes:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  body:
                                    type: object
                                    additionalProperties: true
                                required: [name, body]
                            containers:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  body:
                                    type: object
                                    additionalProperties: true
                                required: [name, body]
                          required: [volumes, containers]
                      required: [sessionId, epoch]
                  workspaces:
                    type: array
                    description: The sessions whose workspace to keep.
                    items:
                      type: string
                      format: uuid
                required:
                - sessions
                - executions
                - workspaces
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
