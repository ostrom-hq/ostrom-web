      summary: 'Exchange an approver''s link (`/yes#signin=opk_…`) for the session cookie. The console and the app read
        the token from the fragment, erase it at once (`history.replaceState`) and post it here: it never appears in a
        URL the server receives. Single-use. The `Origin` header must be an allowed one (the console''s), else 403. The
        answer sends the console to `/yes`. Not the e-mail sign-in, which is `/api/v1/auth/email/verify`'
      security: []
      requestBody:
        required: true
