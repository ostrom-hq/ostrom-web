    post:
      operationId: verifySignInEmail
      x-ostrom-status: served
      tags:
      - auth
      summary: 'Sign in with the token of an e-mailed link, read by the console from the link''s fragment
        (`/auth/email#token=…`). The `Origin` header must be the console''s, and the request must carry the
        `ostrom_email_link` cookie of the browser that asked for the link (`requestSignInEmail`)'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          description: Signed in; the session is in the cookies, never in the body
          headers:
            Set-Cookie:
              description: '`__Host-ostrom_session` (HttpOnly) and the readable `__Host-ostrom_csrf`; `ostrom_email_link`
