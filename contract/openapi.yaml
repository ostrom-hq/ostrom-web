    Workflow:
      type: object
      description: A workflow
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        description:
          type: string
        version:
          type: integer
        repos:
          type: array
          description: 'Repositories the workflow applies to, `owner/name` where `*` is any part of a name (1 to
            100). Absent: every repository of the organization, as before. Present: these only, whether the workflow
