          items:
            type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdge'
        start:
          type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInput'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/RuleSource'
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        foundAt:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: string
      required:
      - id
      - name
      - domain
      - nodes
      - edges
      - status
      - foundAt
    WorkflowEdge:
      type: object
      description: An edge. For a run, [on] is the outcome that follows it (`next`, `delivered`, a wait action id); [to] null
        ends
      properties:
        from:
          type: string
        to:
          type:
          - string
          - 'null'
        label:
          type: string
        'on':
          type: string
      required:
      - from
      - to
    WorkflowInput:
      type: object
      description: An input of a workflow run
      properties:
        id:
          type: string
        label:
          type: string
        required:
          type: boolean
        default:
          type: string
        maxLength:
          type: integer
      required:
      - id
      - label
    WorkflowNode:
      type: object
      description: A workflow node
      properties:
        id:
          type: string
        kind:
