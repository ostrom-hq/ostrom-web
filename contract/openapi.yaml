  /api/v1/confirmations/{id}:
    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    get:
      operationId: getGovernanceConfirmation
      x-ostrom-status: served
      tags:
      - governance
      summary: A governance confirmation, with the exact change it makes; `wait` long-polls up to that many seconds
      description: |-
        Read by its requester (with any of their credentials) and by the owners and admins of its organization; anyone
        else, and another organization, gets 404. A pending confirmation past its 15 minutes reads as `expired`.

        With `wait`, a pending confirmation is waited on for its answer: the response comes as soon as it is no longer
        pending, or with it still pending when the wait ends; the caller then asks again until `expiresAt`. A
        confirmation that is not pending answers at once. The wait is 0 to 30 seconds (a server given a value outside
        that range waits for the nearest bound; a client sends one within it). A waiting request holds no database
        connection. A client sets its HTTP timeout above the wait.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: wait
        in: query
        required: false
        description: Seconds to wait on a pending confirmation for its answer; absent or 0 reads at once.
        schema:
          type: integer
          minimum: 0
          maximum: 30
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceConfirmation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/confirmations/{id}/answer:
    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    post:
      operationId: answerGovernanceConfirmation
      x-ostrom-status: served
      tags:
      - governance
      summary: Confirm or refuse a governance confirmation, as an owner or an admin signed in to the console
      description: |-
        Only a browser session answers (a token gets 403 `forbidden`), of an owner or an admin of the organization (403
        `forbidden` otherwise), once (409 `confirmation_closed`), within its 15 minutes (410 `confirmation_expired`).

        `confirm` needs a sign-in less than 5 minutes old (403 `step_up_required`: sign in again, then confirm), as a
        yes does; `refuse` does not. A confirmation applies the change exactly as it was shown, as a signed decision of
        the person who confirms (the requester is kept in the confirmation and the audit log). When what it changes is
        no longer what it showed as `before`, nothing is written and the confirmation closes as `failed` with 409
        `confirmation_stale`. When the write itself is refused (a version conflict, a rule deleted meanwhile), the
        confirmation closes as `failed` with that error, and the answer is that error. When it fails for a reason the
        server does not show, the answer is 500 `internal_error` and the confirmation closes as `failed` with
        `internal_error`. Each step (created, confirmed, refused, expired, failed) is an event of the organization's
        signed audit log.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceConfirmationAnswerRequest'
      responses:
        '200':
          description: The answered confirmation; when confirmed, `result` holds what the write returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceConfirmation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: step_up_required (sign in again, then confirm), or forbidden (a token, not an owner or admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpOrForbidden'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: confirmation_closed, confirmation_stale, or the confirmed write's own error (key `error.type`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: confirmation_expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
