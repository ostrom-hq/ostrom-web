# The Ostrom API contract (OpenAPI 3.1). Source of the TypeScript types; the Kotlin models are checked against it.
openapi: 3.1.0
info:
  title: Ostrom API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: 'The contract of the Ostrom server, owned by ostrom-core. Schemas without `x-ostrom-kotlin: pending` have a
    Kotlin model in `dev.ostrom.core.api.models` with the same JSON shape (checked by `api-types/scripts/check-contract.mjs`).
    TypeScript types are generated from this file (`@ostrom-hq/api-types`).

    Every operation carries `x-ostrom-status`: `served` when the server on `main` of ostrom-server answers it, `planned`
    otherwise. The public API reference lists the `served` ones only. A server PR that serves a route sets its operation
    to `served` here, in the same change set.

    A browser signs in with the `ostrom_session` cookie (HttpOnly, Secure, SameSite=Lax); the CLI, the app, devices,
    runners and service keys send a bearer token. With the cookie, every request that changes something (POST, PUT,
    PATCH, DELETE) also sends `X-CSRF-Token`, equal to the readable `ostrom_csrf` cookie, or is refused with 403.

    Every route is under `/api/v1`, except `/health` and the incoming webhooks (`/webhooks/stripe`, `/webhooks/github`,
    `/webhooks/slack`), each authenticated by its sender''s signature.'
servers:
- url: https://{host}
  variables:
    host:
      default: localhost:4317
security:
- bearer: []
- sessionCookie: []
tags:
- name: analysis
- name: approvals
- name: artifacts
- name: audit
- name: auth
- name: automations
- name: billing
- name: budgets
- name: checks
- name: delivery
- name: events
- name: gates
- name: github
- name: import
- name: inference
- name: mcp
- name: meta
- name: notifications
- name: organization
- name: packages
- name: receipts
- name: rules
- name: runners
- name: secrets
- name: sessions
- name: sharing
- name: waits
- name: webhooks
- name: workflows
paths:
  /health:
    get:
      operationId: healthRoot
      x-ostrom-status: served
      tags:
      - meta
      summary: Liveness, outside the API prefix for probes (same answer as `/api/v1/health`)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/health:
    get:
      operationId: health
      x-ostrom-status: served
      tags:
      - meta
      summary: Liveness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/instance:
    get:
      operationId: getInstance
      x-ostrom-status: served
      tags:
      - meta
      summary: The instance and the key it signs with now; unauthenticated, clients verify signatures before signing in
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
  /api/v1/instance/keys:
    get:
      operationId: listInstanceKeys
      x-ostrom-status: served
      tags:
      - meta
      summary: Every signing key the instance has used, oldest first
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstanceSigningKey'
                required:
                - keys
  /api/v1/capabilities:
    get:
      operationId: capabilities
      x-ostrom-status: planned
      tags:
      - meta
      summary: Capabilities of this server (feature keys and versions)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  capabilities:
                    type: array
                    items:
                      type: string
                required:
                - version
                - capabilities
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/github/start:
    get:
      operationId: startGithubLogin
      x-ostrom-status: planned
      tags:
      - auth
      summary: 'Start the GitHub OAuth sign-in. Browser: `redirect`. Mobile app: `redirect_uri` (ostrom://auth/callback),
        `state`, PKCE `code_challenge` and `code_challenge_method=S256`; the server redirects back with a one-time `code`'
      parameters:
      - name: redirect
        in: query
        required: false
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/mobile/token:
    post:
      operationId: mobileToken
      x-ostrom-status: planned
      tags:
      - auth
      summary: Exchange the one-time code of the mobile sign-in (PKCE) for a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                codeVerifier:
                  type: string
                redirectUri:
                  type: string
              required:
              - code
              - codeVerifier
              - redirectUri
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthUser'
                  expiresAt:
                    type: string
                required:
                - token
                - user
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/github/callback:
    get:
      operationId: githubLoginCallback
      x-ostrom-status: planned
      tags:
      - auth
      summary: GitHub OAuth callback
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/device:
    post:
      operationId: startDeviceLogin
      x-ostrom-status: planned
      tags:
      - auth
      summary: Start the device flow (CLI sign-in)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCode'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/device/token:
    post:
      operationId: pollDeviceLogin
      x-ostrom-status: planned
      tags:
      - auth
      summary: Exchange a confirmed device code for a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceCode:
                  type: string
              required:
              - deviceCode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '428':
          description: authorization pending
  /api/v1/auth/token/refresh:
    post:
      operationId: refreshToken
      x-ostrom-status: planned
      tags:
      - auth
      summary: Refresh a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/launcher/config:
    get:
      operationId: getLauncherConfig
      x-ostrom-status: planned
      tags:
      - auth
      summary: What the CLI needs to sign in (GitHub OAuth client id)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  githubClientId:
                    type: string
                required:
                - githubClientId
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/launcher/login:
    post:
      operationId: launcherLogin
      x-ostrom-status: planned
      tags:
      - auth
      summary: Exchange a GitHub token proven by the CLI for a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                githubToken:
                  type: string
                via:
                  type: string
              required:
              - githubToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  login:
                    type: string
                  token:
                    type: string
                  expiresAt:
                    type: string
                required:
                - login
                - token
                - expiresAt
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/launches:
    post:
      operationId: createLaunch
      x-ostrom-status: planned
      tags:
      - auth
      summary: 'Start an agent launch: returns an agent token scoped to the sessions of this launch, expiring at its end.
        The device token never enters the agent environment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repo:
                  type: string
                agent:
                  type: string
                model:
                  type: string
              required:
              - agent
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  launchId:
                    type: string
                  agentToken:
                    type: string
                  expiresAt:
                    type: string
                required:
                - launchId
                - agentToken
                - expiresAt
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/policy/agents:
    get:
      operationId: checkAgentPolicy
      x-ostrom-status: planned
      tags:
      - auth
      summary: May this developer launch this agent with this model
      parameters:
      - name: agent
        in: query
        required: false
        schema:
          type: string
      - name: dev
        in: query
        required: false
        schema:
          type: string
      - name: model
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  reason:
                    type: string
                  note:
                    type: string
                required:
                - allowed
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/me:
    get:
      operationId: getMe
      x-ostrom-status: planned
      tags:
      - auth
      summary: 'The caller: login, member, organization'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
  /api/v1/auth/email:
    post:
      operationId: requestSignInEmail
      x-ostrom-status: planned
      tags:
      - auth
      summary: E-mail a sign-in link; the answer is the same whether the address has an account or not
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                redirect:
                  type: string
                  description: The console path to return to after signing in
              required:
              - email
      responses:
        '202':
          description: Sent if the address may sign in
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/email/verify:
    post:
      operationId: verifySignInEmail
      x-ostrom-status: planned
      tags:
      - auth
      summary: 'Sign in with the token of an e-mailed link, read by the console from the link''s fragment
        (`/auth/email#token=…`). The `Origin` header must be the console''s'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          description: Signed in; the session is in the cookies, never in the body
          headers:
            Set-Cookie:
              description: '`ostrom_session` (HttpOnly) and the readable `ostrom_csrf`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/link:
    post:
      operationId: exchangeSignInLink
      x-ostrom-status: planned
      tags:
      - auth
      summary: 'Exchange an approver''s link (`/yes#signin=opk_…`) for the session cookie. The console and the app read
        the token from the fragment, erase it at once (`history.replaceState`) and post it here: it never appears in a
        URL the server receives. Single-use. Not the e-mail sign-in, which is `/api/v1/auth/email/verify`'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          description: Signed in; the session is in the cookies, never in the body
          headers:
            Set-Cookie:
              description: '`ostrom_session=…; HttpOnly; Secure; SameSite=Lax; Path=/` and the readable
                `ostrom_csrf=…; Secure; SameSite=Lax; Path=/`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedIn'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      x-ostrom-status: planned
      tags:
      - auth
      summary: Sign out
      description: 'Revokes the calling token or browser session, deletes the push devices registered with it (the app
        receives no more yes requests), and for a browser session expires the `ostrom_session` and `ostrom_csrf`
        cookies.'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/sessions:
    get:
      operationId: listAuthSessions
      x-ostrom-status: planned
      tags:
      - auth
      summary: Signed-in sessions of the caller
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthSession'
                  next:
                    type: string
                required:
                - items
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeAuthSession
      x-ostrom-status: planned
      tags:
      - auth
      summary: Revoke a signed-in session
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/service-keys:
    get:
      operationId: listServiceKeys
      x-ostrom-status: planned
      tags:
      - auth
      summary: Service keys (admins)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceKey'
                  next:
                    type: string
                required:
                - items
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    post:
      operationId: createServiceKey
      x-ostrom-status: planned
      tags:
      - auth
      summary: Create a service key; its secret is returned once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
              required:
              - name
              - scopes
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKey'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/service-keys/{id}:
    delete:
      operationId: deleteServiceKey
      x-ostrom-status: planned
      tags:
      - auth
      summary: Delete a service key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/devices:
    get:
      operationId: listDevices
      x-ostrom-status: planned
      tags:
      - auth
      summary: Workstations where the caller is signed in
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  next:
                    type: string
                required:
                - items
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/devices/{id}:
    delete:
      operationId: deleteDevice
      x-ostrom-status: planned
      tags:
      - auth
      summary: Sign a workstation out
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/push-devices:
    post:
      operationId: registerPushDevice
      x-ostrom-status: planned
      tags:
      - notifications
      summary: 'Register a phone for push notifications (push data: {kind: "approval", approvalId})'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pushToken:
                  type: string
                provider:
                  type: string
                platform:
                  type: string
                locale:
                  type: string
              required:
              - pushToken
              - provider
              - platform
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDevice'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/push-devices/{id}:
    delete:
      operationId: deletePushDevice
      x-ostrom-status: planned
      tags:
      - notifications
      summary: Stop push notifications to a phone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/me/notifications:
