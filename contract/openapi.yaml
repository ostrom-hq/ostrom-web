      properties:
        sessionId:
          type: string
        runId:
          type: string
        repo:
          type: string
        realRepo:
          type: string
        class:
          type: string
        tool:
          type: string
        command:
          type: string
        dev:
          type: string
        harnessVersion:
          type: string
        ci:
          $ref: '#/components/schemas/GateCi'
        diff:
          type: string
        push:
          $ref: '#/components/schemas/GatePush'
        pr:
          $ref: '#/components/schemas/GatePullRequest'
      required:
      - class
    GateCatalog:
      type: object
      description: The gates of a repository and the action classes they cover
      properties:
        gates:
          type: array
          items:
            $ref: '#/components/schemas/GateRef'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/GateAction'
      required:
      - gates
      - actions
      x-ostrom-kotlin: pending
    GateCi:
      type: object
      description: CI context of a gate asked by a CI check
      properties:
        sha:
          type: string
        pr:
          type: string
    GateMode:
      type: string
      enum:
      - enforced
      - shadow
      - ungated
    GatePullRequest:
      type: object
      description: 'A pull request merge, whichever path asked (the `gh pr merge` hook, the GitHub check): one request per
