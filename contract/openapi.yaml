        label:
          type: string
        detail:
          type: string
        owner:
          type: string
        approvers:
          type: array
          items:
            type: string
        approverReason:
          type: string
        when:
          $ref: '#/components/schemas/NodeWhen'
        ruleIds:
          type: array
          items:
            type: string
        position:
          $ref: '#/components/schemas/NodePosition'
        actions:
