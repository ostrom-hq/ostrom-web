        id:
          type: string
        title:
          type: string
        owner:
          type: string
        access:
          type: string
        latestVersion:
          type: integer
        url:
          type: string
          description: The console's page for it
        publicUrl:
          type: string
          description: Its public link, for `link` access on a server that serves pages
        createdAt:
          type: string
        updatedAt:
          type: string
