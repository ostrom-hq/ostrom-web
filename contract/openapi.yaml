    post:
      operationId: deliverRun
      x-ostrom-status: served
      tags:
      - workflows
      summary: "Hand in what the run's current agent node asks for (`workflows.deliver.v1`): the run's starter, a person
        or their key with `workflows:write`"
      description: "The output is checked against the node's deliverable: `artifact` (an artifact id), `url` (https, on
        the node's `domain` or a subdomain of it when set), `text`, or `json` matching its `schema` (a subset: `type`,
        an object's `properties` and `required`, an array's `items`, a string's `enum`). A wrong one is 400
        `invalid_deliverable` and stores nothing; a run whose current node waits for no delivery is 409
        `nothing_to_deliver`; a session whose todo still has open items is 409 `todo_open` (`todos.v1`). Of two
        deliveries of one visit, one wins, the other is 409 `nothing_to_deliver`. Another member's run, or one that
        does not exist, is 404"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliverRequest'
      responses:
        '200':
          description: The run after the delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/workflows/session/deliver:
    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    post:
      operationId: deliverWorkflowSession
      x-ostrom-status: served
      tags:
      - workflows
      summary: "Deliver for the agent step a session works on (`workflows.deliver.v1`): the run's starter naming
        `sessionId`, or the session's agent token with the scope `workflow:session`"
      description: "Finds the unfinished run whose latest active visit is an agent visit bound to the session, then does
        exactly what `deliverRun` does (same checks, same errors). An agent token is confined to its launch's session
        whatever `sessionId` says, and `workflow:session` grants nothing else (not `deliverRun`, not a read of a run). A
        service key carrying the scope, or an agent token issued before it existed, is 403 `credential_scope`. A session
        that does not exist or is another member's is 404; the caller's own session that runs no step is 409
        `nothing_to_deliver`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
