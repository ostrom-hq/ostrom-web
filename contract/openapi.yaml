    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    post:
      operationId: workflowsMcp
      x-ostrom-status: served
      tags:
      - workflows
      summary: "The `ostrom-workflow` MCP server (JSON-RPC over HTTP, `workflows.deliver.v1`): one tool, `deliver
        {output}`, for the agent token of the session that works on an agent step (scope `workflow:session`)"
      description: "Bridged to the agent by the CLI's session relay (`ostrom mcp --session … --server ostrom-workflow`),
        which names the session; the agent cannot name another. The tool tells the agent to call it once, when the task
        of the current step is done, with exactly what the step asked for, then to end its turn, and never for an
        ordinary session. Refusals (`invalid_deliverable`, `nothing_to_deliver`, `todo_open`, `credential_scope`,
        `not_found`) come back as tool errors saying what to do"
