      x-ostrom-status: served
      tags:
      - inference
      summary: OpenAI-compatible Responses endpoint, metered against budgets
      description: "Admission (`inference.queue.v1`): a call that cannot start now waits in the organization's admission queue, shared by every replica, instead of being refused: while every shared account it may use is busy (and no provider key of the organization takes it), or while the member already runs as many calls as their `maxConcurrent` in `InferenceSettings.memberConcurrency` allows them (0, the default, never makes a call wait). Ready members take turns, one member's calls go in arrival order, `interactive` calls go before `background` ones, which join them after 30 seconds of waiting. At most 128 calls wait per organization and 8 per member who has a concurrency limit; a call waits at most 90 seconds. Past a bound: 503 `queue_full`; past the wait: 503 `queue_timeout`; a wait lost (its replica stopped renewing it): 503 `queue_expired`; each with `Retry-After: 15`. Waiting holds no budget and no account. Budget and policy refusals stay immediate. A refusal of the gateway carries `x-ostrom-error` with its code (`no_capacity`, `queue_full`, `budget_exhausted`...)"
      parameters:
      - $ref: '#/components/parameters/OstromWorkload'
      - $ref: '#/components/parameters/OstromClientRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: 'OK, the provider''s answer as it sent it: JSON when the request does not stream; with
            `"stream": true`, server-sent events whose every `data:` is an `OpenAiResponsesStreamEvent`. Planned: the
            strict contract test of ostrom-server does not read the events yet'
