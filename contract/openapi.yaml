      properties:
        login:
          type: string
        verified:
          type: boolean
        via:
          type: string
        organizationId:
          type: string
      required:
      - login
      - verified
      - via
    Device:
      type: object
      description: A workstation where the CLI is signed in
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        cliVersion:
          type: string
        lastSeenAt:
          type: string
      required:
      - id
      - name
      - platform
      x-ostrom-kotlin: pending
    DeviceCode:
      type: object
      description: OAuth device flow start
      properties:
        deviceCode:
          type: string
        userCode:
          type: string
        verificationUri:
          type: string
        interval:
          type: integer
        expiresIn:
          type: integer
      required:
      - deviceCode
      - userCode
      - verificationUri
      - interval
      - expiresIn
      x-ostrom-kotlin: pending
    EndSessionRequest:
      type: object
      description: 'Ends a session (hook `SessionEnd` or the launcher): the server signs the segment''s receipt'
      properties:
        tools:
          type: integer
        model:
          type: string
        costUsd:
          type: number
        source:
          type: string
        exitCode:
          type: integer
    ErrorDetail:
      type: object
      description: 'A refusal: a stable snake_case key and a human message'
      properties:
        type:
          type: string
        message:
          type: string
      required:
      - type
      - message
    Evidence:
      type: object
      description: A line of evidence shown with an approval
      properties:
        label:
          type: string
        value:
          type: string
        url:
          type: string
      required:
      - label
      - value
    GateAction:
      type: object
      description: A boundary action a gate covers
      properties:
        class:
          type: string
        label:
          type: string
        patterns:
          type: array
          items:
            type: string
        repos:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: string
      required:
      - class
      - label
      - patterns
      - repos
    GateAskRequest:
      type: object
