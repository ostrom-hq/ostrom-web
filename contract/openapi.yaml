      summary: The organization's outgoing webhooks
      description: 'Outgoing webhooks (`webhooks.v1`) send the events of the organization''s feed (`GET /api/v1/events`)
        to the caller''s own services as signed HTTP requests, retried until the receiver answers. A webhook receives the
        whole organization''s events, so only an owner or an admin reads and manages them: with an interactive login (a
        browser session, the unlocked app or `ostrom login`), or a service key of theirs holding `cloud:admin` (403
        `forbidden` for anyone else: a personal token made in the console whatever its `cloud:*` scopes, a member''s key
        and a `team:read` key included). At most 20 per organization, oldest first.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    post:
      operationId: createWebhook
      x-ostrom-status: served
      tags:
      - webhooks
      summary: Add an outgoing webhook; its signing secret is returned once
      description: 'The target is an `https` URL of at most 2 048 characters, without credentials or fragment, on the
        public internet: `localhost`, loopback, private (RFC 1918, unique-local IPv6), link-local, carrier-grade NAT,
        multicast, unspecified, reserved and cloud metadata addresses are refused (400 `webhook_host_not_allowed`), in
        numeric spellings too. A name is resolved again at every delivery, through the server''s pinned resolver: a name
        that answers such an address is refused at the connection (`host_not_allowed` in the delivery log), DNS rebinding
        included. Redirects are not followed. The operator may allow loopback and private targets
        (`OSTROM_WEBHOOKS_ALLOW_PRIVATE_TARGETS=true`); link-local, unspecified and metadata addresses stay refused.
