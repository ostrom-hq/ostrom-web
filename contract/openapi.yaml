      description: 'A person, an owner or an administrator. `version` is the one replaced (0 for the first save;
        409 `artifact_storage_conflict` otherwise). Endpoint `https://host[:port]` without path, credentials, query or
        fragment; link-local, unspecified and cloud metadata hosts are refused in every numeric spelling (400
        `artifact_storage_host_not_allowed`), private and loopback addresses are allowed (MinIO); every request to the
        bucket goes through the SSRF-checked outbound client, which resolves the host again. Region `[a-z0-9-]`; bucket
        3 to 63 lowercase letters, digits, dots and dashes; prefix up to 8 `[a-z0-9._-]` segments, no `.` or `..`.
        An omitted secret keeps the stored one; changing the endpoint or the bucket needs a new one (400
        `artifact_storage_secret_required`). The secret is sealed with the instance key and never shown again. Once
        artifacts may have files in the bucket, the endpoint, bucket and prefix are fixed (409
        `artifact_storage_in_use`); keys can still be rotated. Any save makes artifacts inactive until a connection
        test of the new version passes'
      requestBody:
        required: true
