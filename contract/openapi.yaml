        values:
          type: object
          additionalProperties: {}
        author:
          type: string
        answeredAt:
          type: string
      required:
      - action
      - author
      - answeredAt
    WaitField:
      type: object
      description: A field of a wait
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        help:
          type: string
        required:
          type: boolean
        default: {}
        options:
          type: array
          items:
            type: string
        multiple:
          type: boolean
        allowOther:
          type: boolean
        maxLength:
          type: integer
      required:
      - id
      - type
      - label
    WaitRef:
      type: object
