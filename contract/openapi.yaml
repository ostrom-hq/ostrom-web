# The Ostrom API contract (OpenAPI 3.1). Source of the TypeScript types; the Kotlin models are checked against it.
openapi: 3.1.0
info:
  title: Ostrom API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: 'The contract of the Ostrom server, owned by ostrom-core. Schemas without `x-ostrom-kotlin: pending` have a
    Kotlin model in `dev.ostrom.core.api.models` with the same JSON shape (checked by `api-types/scripts/check-contract.mjs`).
    TypeScript types are generated from this file (`@ostrom-hq/api-types`).'
servers:
- url: https://{host}
  variables:
    host:
      default: localhost:4317
security:
- bearer: []
tags:
- name: analysis
- name: approvals
- name: artifacts
- name: audit
- name: auth
- name: automations
- name: budgets
- name: checks
- name: delivery
- name: events
- name: gates
- name: github
- name: inference
- name: mcp
- name: meta
- name: notifications
- name: organization
- name: packages
- name: receipts
- name: rules
- name: runners
- name: secrets
- name: sessions
- name: sharing
- name: waits
- name: webhooks
- name: workflows
paths:
  /api/v1/health:
    get:
      operationId: health
      tags:
      - meta
      summary: Liveness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
                required:
                - status
                - version
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/capabilities:
    get:
      operationId: capabilities
      tags:
      - meta
      summary: Capabilities of this server (feature keys and versions)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  capabilities:
                    type: array
                    items:
                      type: string
                required:
                - version
                - capabilities
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/github/start:
    get:
      operationId: startGithubLogin
      tags:
      - auth
      summary: 'Start the GitHub OAuth sign-in. Browser: `redirect`. Mobile app: `redirect_uri` (ostrom://auth/callback),
        `state`, PKCE `code_challenge` and `code_challenge_method=S256`; the server redirects back with a one-time `code`'
      parameters:
      - name: redirect
        in: query
        required: false
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/mobile/token:
    post:
      operationId: mobileToken
      tags:
      - auth
      summary: Exchange the one-time code of the mobile sign-in (PKCE) for a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                codeVerifier:
                  type: string
                redirectUri:
                  type: string
              required:
              - code
              - codeVerifier
              - redirectUri
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthUser'
                  expiresAt:
                    type: string
                required:
                - token
                - user
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/github/callback:
    get:
      operationId: githubLoginCallback
      tags:
      - auth
      summary: GitHub OAuth callback
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/device:
    post:
      operationId: startDeviceLogin
      tags:
      - auth
      summary: Start the device flow (CLI sign-in)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCode'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/device/token:
    post:
      operationId: pollDeviceLogin
      tags:
      - auth
      summary: Exchange a confirmed device code for a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceCode:
                  type: string
              required:
              - deviceCode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '428':
          description: authorization pending
  /api/v1/auth/token/refresh:
    post:
      operationId: refreshToken
      tags:
      - auth
      summary: Refresh a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/launcher/config:
    get:
      operationId: getLauncherConfig
      tags:
      - auth
      summary: What the CLI needs to sign in (GitHub OAuth client id)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  githubClientId:
                    type: string
                required:
                - githubClientId
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/launcher/login:
    post:
      operationId: launcherLogin
      tags:
      - auth
      summary: Exchange a GitHub token proven by the CLI for a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                githubToken:
                  type: string
                via:
                  type: string
              required:
              - githubToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  login:
                    type: string
                  token:
                    type: string
                  expiresAt:
                    type: string
                required:
                - login
                - token
                - expiresAt
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/launches:
    post:
      operationId: createLaunch
      tags:
      - auth
      summary: 'Start an agent launch: returns an agent token scoped to the sessions of this launch, expiring at its end.
        The device token never enters the agent environment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repo:
                  type: string
                agent:
                  type: string
                model:
                  type: string
              required:
              - agent
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  launchId:
                    type: string
                  agentToken:
                    type: string
                  expiresAt:
                    type: string
                required:
                - launchId
                - agentToken
                - expiresAt
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/policy/agents:
    get:
      operationId: checkAgentPolicy
      tags:
      - auth
      summary: May this developer launch this agent with this model
      parameters:
      - name: agent
        in: query
        required: false
        schema:
          type: string
      - name: dev
        in: query
        required: false
        schema:
          type: string
      - name: model
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  reason:
                    type: string
                  note:
                    type: string
                required:
                - allowed
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/me:
    get:
      operationId: getMe
      tags:
      - auth
      summary: 'The caller: login, member, organization'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: Revoke the current token
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/sessions:
    get:
      operationId: listAuthSessions
      tags:
      - auth
      summary: Signed-in sessions of the caller
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthSession'
                  next:
                    type: string
                required:
                - items
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeAuthSession
      tags:
      - auth
      summary: Revoke a signed-in session
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/service-keys:
    get:
      operationId: listServiceKeys
      tags:
      - auth
      summary: Service keys (admins)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceKey'
                  next:
                    type: string
                required:
                - items
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    post:
      operationId: createServiceKey
      tags:
      - auth
      summary: Create a service key; its secret is returned once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
              required:
              - name
              - scopes
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKey'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/service-keys/{id}:
    delete:
      operationId: deleteServiceKey
      tags:
      - auth
      summary: Delete a service key
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/devices:
    get:
      operationId: listDevices
      tags:
      - auth
      summary: Workstations where the caller is signed in
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  next:
                    type: string
                required:
                - items
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/devices/{id}:
    delete:
      operationId: deleteDevice
      tags:
      - auth
      summary: Sign a workstation out
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/push-devices:
    post:
      operationId: registerPushDevice
      tags:
      - notifications
      summary: 'Register a phone for push notifications (push data: {kind: "approval", approvalId})'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pushToken:
                  type: string
                provider:
                  type: string
                platform:
                  type: string
                locale:
                  type: string
              required:
              - pushToken
              - provider
              - platform
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDevice'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/push-devices/{id}:
    delete:
      operationId: deletePushDevice
      tags:
      - notifications
      summary: Stop push notifications to a phone
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/me/notifications:
    get:
      operationId: getNotificationPreferences
      tags:
      - notifications
      summary: Notification preferences of the caller
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    put:
      operationId: setNotificationPreferences
      tags:
      - notifications
      summary: Set the notification preferences of the caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/activity:
    get:
      operationId: listActivity
      tags:
      - events
      summary: Activity feed, newest first
      parameters:
      - name: before
        in: query
        required: false
        schema:
          type: string
      - name: repo
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityItem'
                  next:
                    type: string
                required:
                - items
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spending:
    get:
      operationId: getSpending
      tags:
      - budgets
      summary: Spending by agent, repository and person
      parameters:
      - name: period
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spending'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/github/app:
    get:
      operationId: getGithubApp
      tags:
      - github
      summary: The GitHub App of the organization and its installation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed:
                    type: boolean
                  slug:
                    type: string
                  installationId:
                    type: integer
                  htmlUrl:
                    type: string
                required:
                - installed
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/github/app/manifest/start:
    get:
      operationId: startGithubAppManifest
      tags:
      - github
      summary: Create the GitHub App by the manifest flow
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/github/app/manifest/callback:
    get:
      operationId: githubAppManifestCallback
      tags:
      - github
      summary: Manifest flow callback
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/github/app/install/start:
    get:
      operationId: startGithubAppInstall
      tags:
      - github
      summary: Install the GitHub App on the organization
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/github/app/install/callback:
    get:
      operationId: githubAppInstallCallback
      tags:
      - github
      summary: Installation callback
      parameters:
      - name: installation_id
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/github/webhook:
    post:
      operationId: githubWebhook
      tags:
      - github
      summary: GitHub webhook (X-Hub-Signature-256)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/github/checks:
    post:
      operationId: githubCheck
      tags:
      - github
      summary: A CI check asks the gate of a pull request merge or a push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repo:
