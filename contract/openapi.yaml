    post:
      operationId: createArtifactTicket
      x-ostrom-status: served
      tags:
      - artifacts
      summary: 'A reading ticket: a sealed address of the entry page on the content origin, for the caller only'
      description: 'For a person only, a browser session, the unlocked app or the CLI''s sign-in (403 `forbidden` for a
        token a program can present). The ticket is sealed (encrypted and authenticated, so the page learns nothing of its reader) and names
        the member and the credential that asked: it lasts 8 hours (rounded down to 10 minutes, so reloading reuses the
        same address), and the server checks again at most every 30 seconds that the credential is still live, the
        member still in the organization and the artifact still readable by them, so signing out, leaving the
        organization or losing access stops it within 30 seconds. At most 60 tickets a minute per credential (429
        `rate_limited` with `Retry-After`)'
