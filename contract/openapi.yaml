      description: 'A person only (a browser session, the unlocked app or the CLI''s sign-in), an owner or an
        administrator of the organization; no key reaches it, whatever its scopes (TeamCode `docs/artifacts.md`,
        "Storage and settings"). The secret access key is never returned. Artifact files live only in this bucket:
        PostgreSQL keeps their metadata (artifacts, versions, members, manifests), never their bytes'
      responses:
        '200':
          description: OK
