      x-ostrom-status: served
      tags:
      - runners
      summary: Register a runner (service key)
      description: 'An owner or an admin of the organization, from a signed-in console session (a personal, CLI or
        service token gets 403), registers a machine. The answer carries the runner''s `token`, shown this once: only its
        hash is kept. The name is unique in the organization and an organization registers at most 100 runners (409
        otherwise). The name is 1 to 64 characters; at most 16 labels, each 1 to 64 letters, digits, `.`, `_`, `:` or `-`,
        starting with a letter or a digit (400 otherwise). The name is unique whatever its case and refuses control and
        invisible formatting characters. The answer is not cached (`Cache-Control: no-store`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                labels:
                  type: array
                  items:
                    type: string
                version:
                  type: string
              required:
              - name
              - labels
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runner'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
