components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An Ostrom token (CLI, app, device, runner or service key)
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ostrom_session
      description: 'The browser session of the console: HttpOnly, Secure, SameSite=Lax, Path=/, no Domain (plain
        `ostrom_session` only on a plain-HTTP development server). Set by a sign-in, never carried in a body, a URL or
        a redirect. With it, every POST, PUT, PATCH and DELETE also sends the `X-CSRF-Token` header, equal to the
        readable `__Host-ostrom_csrf` cookie set beside it, from an allowed `Origin`; otherwise 403. Sign-out expires
        both cookies.'
  parameters:
    OstromOrg:
      name: Ostrom-Org
      in: header
      required: false
      description: The id of the organization the request acts in. Required when the signed-in person is a member of
        several organizations; without it, a person with exactly one active membership acts in that organization. Missing
        while several memberships are active, 409 `org_required` (`error.type`, the usual `ApiError` body); an
        organization the person is not a member of, 404, as for anything of another organization. A token bound to one
        organization (device, agent, runner, service key) acts in its own organization
      schema:
        type: string
  responses:
    GovernanceConfirmationPending:
      description: |-
        Not applied: made with a person's API token (the CLI's, `ostrom login --admin` or not), the governance write
        opened a confirmation, which an owner or an admin confirms on the console within 15 minutes
        (`getGovernanceConfirmation`). A browser session's write and an `inference:admin` service key's are applied at
        once, as before.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GovernanceConfirmationPending'
    ConfirmationLimit:
      description: 'confirmation_limit: the person already has 10 governance confirmations waiting (expired, refused and
        answered ones do not count)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error:
      description: A refusal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InferenceRefused:
      description: "Too many requests, in the provider's own error shape, which satisfies `ApiError` (`error.type`,
        `error.message`). Refused by the budgets before any provider is called: `error.type` `rate_limit_error` on the
        Messages endpoint, `insufficient_quota` on the OpenAI-compatible ones, which also carry `error.code`
        `budget_exhausted` or `budget_insufficient`; `error.message` starts with one of three fixed phrases a client can
        match on (`LedgerSpendGuard.EXHAUSTED`, `.EXHAUSTED_TODAY` and `.INSUFFICIENT` in ostrom-server). `Monthly
        budget reached: ...`: a monthly limit of the organization or of the member is spent; `Retry-After` gives the
        seconds until the month ends (UTC), when the limit resets. `Daily budget reached: ...`: a daily limit is spent;
        `Retry-After` gives the seconds until the day ends (00:00 UTC). Only a limit with `hardStop` refuses a call.
        `Budget left too low for this call: ...`: the limit is not spent, but what
        is left after the calls in flight cannot cover what this call may cost (its output price times the largest of
        its `max_tokens`, `max_output_tokens` and `max_completion_tokens`, 32 000 when it names none, at most 1 000 000;
        plus its estimated input; nothing for a model without a price); the message says what is left and what the
        call may cost, with no `Retry-After`: lower the call's output bound, or retry once the calls in flight finish.
        Every shared account busy or at its limit: `rate_limit_error`, or `rate_limit_exceeded` with `error.code`
        `no_capacity`, with `Retry-After` when the gateway knows when one frees up. A provider's own 429, once no other
        account can take the call, is relayed as the provider sent it, with its `Retry-After` and rate-limit headers"
      headers:
        Retry-After:
          description: When to try again. From the gateway, whole seconds, at least 1; with `Monthly budget reached`,
            until the start of the next month (UTC); with `Daily budget reached`, until 00:00 UTC; absent with
            `Budget left too low for this call`. Relayed from a provider, as the provider wrote it (seconds or an HTTP
            date)
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: 'Too many requests lately (`rate_limited`): nothing was done. A launch is limited per person in an
        organization and per organization, over a sliding hour'
      headers:
        Retry-After:
          description: Seconds until a place frees up
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    AccountAuditEvent:
      type: object
      description: "A signed account-level audit event"
      properties:
        id:
          type: string
        sequence:
          type: integer
        orgId:
          type:
          - string
          - 'null'
        actorId:
          type:
          - string
          - 'null'
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        occurredAt:
          type: string
          format: date-time
        previousHash:
          type:
          - string
          - 'null'
        hash:
          type: string
          description: SHA-256 of the canonical form
        signature:
          type: string
          description: The instance's Ed25519 signature of the canonical form (base64)
        keyId:
          type: string
          description: The instance key that signed it (`GET /api/v1/instance/keys`)
      required:
      - id
      - sequence
      - orgId
      - actorId
      - action
      - targetType
      - targetId
      - details
      - occurredAt
      - previousHash
      - hash
      - signature
      - keyId
      x-ostrom-kotlin: pending
    AccountAuditPage:
      type: object
      description: "A page of audit events, newest first"
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AccountAuditEvent'
        nextBefore:
          type:
          - integer
          - 'null'
          description: The `before` of the next page; null on the last
      required:
      - events
      - nextBefore
      x-ostrom-kotlin: pending
    ActivityActor:
      type: object
      description: Who did it
      properties:
        kind:
          type: string
        name:
          type: string
      required:
      - kind
      - name
      x-ostrom-kotlin: pending
    ActivityItem:
      type: object
      description: 'A line of the activity feed (kind: session.started, session.ended, gate.requested, gate.decided, check.passed,
        check.failed, workflow.changed; clients keep an unknown kind as UNKNOWN)'
      properties:
        id:
          type: string
        at:
          type: string
        kind:
          type: string
        actor:
          $ref: '#/components/schemas/ActivityActor'
        summary:
          type: string
        repo:
          type: string
        costUsd:
          type: number
        approvalId:
          type: string
        gateId:
          type: string
        sessionId:
          type: string
      required:
      - id
      - at
      - kind
      - actor
      - summary
      x-ostrom-kotlin: pending
    AgentEvent:
      type: string
      enum:
      - SessionStart
      - UserPromptSubmit
      - PreToolUse
      - PostToolUse
      - Stop
      - SessionEnd
    AnalysisState:
      type: object
      description: Snapshot of the organization analysis
      properties:
        phase:
          type: string
        progress:
          type: number
        repos:
          type: array
          items:
            $ref: '#/components/schemas/Repo'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
        failure:
          type: object
          additionalProperties:
            type: string
      required:
      - repos
      - rules
      - workflows
      x-ostrom-kotlin: pending
    AnswerApprovalRequest:
      type: object
      description: 'Answers an approval. The answer is refused (409) when [shownDigest] is not the digest of what the approval
        shows now:'
      properties:
        answer:
          $ref: '#/components/schemas/ApprovalAnswer'
        shownDigest:
          type: string
        note:
          type: string
      required:
      - answer
      - shownDigest
    ApiError:
      type: object
      description: The error body of every refusal
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    Approval:
      type: object
      description: 'A request for a yes, shown to an approver. It is bound to what was shown: [shownDigest] is the digest
        of the title,'
      properties:
        id:
          type: string
        group:
          type: string
        workflowId:
          type: string
        taskId:
          type: string
        title:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        repo:
          type: string
        sha:
          type: string
        commits:
          type: array
          items:
            type: string
        commitDetails:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalCommit'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalCheck'
        requestedFrom:
          type: string
        channel:
          type: string
