    post:
      operationId: registerPushDevice
      x-ostrom-status: served
      tags:
      - notifications
      summary: 'Register a phone for push notifications (push data: {kind: "approval", approvalId})'
      description: >-
        Scope `notifications:write`: the phone app's token or a browser session, never a personal or CLI token. The
        phone is registered in the organization `Ostrom-Org` names, or the caller's only one (409 `org_required`
        when they belong to several and name none). One device per push token in an organization: the same token
        registered again keeps its device (its `id` and `createdAt`) and belongs to the member who registered it
        last. A member keeps their ten most recently registered phones. The push token is never answered back. The
        phone sends its FCM registration token (`provider: fcm`, iOS and Android alike) with its P-256 public key
        (`publicKey`, SubjectPublicKeyInfo DER in base64), at every start of the app and when FCM rotates the token:
        each push is encrypted for that key (`PushPayload`), so the provider sees a token and an opaque blob only.
        Who sends the pushes is the instance's `push` settings section (Admin → Settings: `provider` `off` or
        `firebase`, the Firebase service account sealed); while it is `off`, phones register and nothing is sent. With
        `fcm`, a token that is not an FCM registration token or a missing or invalid public key is a 400; a platform
        other than `ios` and `android`, or a provider other than `fcm`, is a 400. `expo` is refused (a 400) since
        Expo was removed, as TeamCode has none; a phone an older app registered with it is never notified until the
        app registers FCM.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushDeviceRequest'
