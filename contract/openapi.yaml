      summary: Test the connection to the artifact bucket
      description: 'A person, an owner or an administrator. Writes `<prefix>/<org>/.ostrom-probe-<uuid>`, reads it back
        and compares its SHA-256, lists the prefix, deletes it and checks it is gone. Each step reports its HTTP status
        and the S3 error code (`AccessDenied`, `NoSuchBucket`, `SignatureDoesNotMatch`...) or a short local code
        (`unreachable`, `timeout`, `dns`, `host_not_allowed`, `digest_mismatch`, `not_listed`, `not_deleted`), never a
        response body. Bounded to 80 seconds, one at a time per organization (409 `artifact_storage_test_running`).
        The result is recorded only for the version tested: a save meanwhile gives `ok: false` with a last step
        `record` / `storage_changed`'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactStorageTest'
