        committedPeople:
          type: integer
          description: People paid in advance on a yearly plan (0 on a monthly plan)
        limits:
          $ref: '#/components/schemas/BillingPlanLimits'
        usage:
          $ref: '#/components/schemas/BillingUsage'
        alerts:
          type: array
          description: Usage alerts raised this period, in percent of the agent hours (80, 100)
