  /api/v1/audit:
    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    get:
      operationId: listAudit
      x-ostrom-status: served
      tags:
      - audit
      summary: Audit log (admins)
      description: >-
        The organization's signed audit log, newest first, 50 lines a page: governance changes (budgets, model
        policy, inference settings, MCP servers, assignments and policies), organization and membership changes,
        the import cutover and the deletion of the organization. Readable by an owner or an admin only (403
        otherwise), with a browser session or a token holding `audit:read`; another organization's log is never
        read (404). `actor` is a person's login (their id once they no longer exist), or `<kind>:<id>` for a
        credential that is not a person's (`service:…`, `agent:…`), or `server:ostrom` for the server itself;
        the `actor` filter takes a login only. `subject` is `<type>:<id>`; `meta`
        holds the event's facts as strings, with `credential` (`browser`, `api_token`…) for a change made through
        the API. `next` is absent on the last page. Each line is checked as it is read, against the line before it in
        the chain even when a filter leaves that one out: `integrity` says what was found, and the line carries what
        a client needs to check it again. The canonical form (sorted keys, no spaces, `null` for an absent value, `v`
        1) holds `action` (`event`), `actorId`, `details` (`meta`), `id`, `occurredAt` (`at`), `orgId`,
        `previousHash`, `sequence`, `targetId` and `targetType` (`subject` split at its first colon); `hash` is its
        SHA-256 and `signature` verifies with the key `keyId` (`GET /api/v1/instance/keys`, past keys included).
        Erasing the newest lines of a chain is not seen.
      parameters:
      - name: actor
        in: query
        required: false
        description: Only this person's events, by login.
        schema:
          type: string
      - name: event
        in: query
        required: false
        description: Only this event, by its exact name (`budget.changed`).
        schema:
          type: string
      - name: before
        in: query
        required: false
        description: The `next` of the previous page (400 when it is not one).
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  next:
                    type: string
                required:
                - items
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Throttled'
  /api/v1/events:
    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    get:
      operationId: streamEvents
      x-ostrom-status: served
      tags:
      - events
      summary: The organization's live event feed (SSE)
      description: 'One server-sent event stream (`events.v1`) for everything the caller may see happen, instead of one
        connection per resource. Each frame is `id: <seq>`, `event: <type>`, `data: <OrgEvent>`. `seq` is the
        organization''s own sequence, gap-free and allocated in the transaction of the change it reports, so an event
        exists exactly when its change committed and a reader never skips one, whichever replica it reads from. The types
        are an open list: a client ignores a type it does not know. The data holds identifiers and short labels, never a
        transcript, a prompt or a secret.


        **Who sees what.** A member sees the events that belong to them (`memberId`); an owner or an admin sees the
        whole organization''s, events that belong to no member included. A service key needs `cloud:read` (or
        `cloud:write`, `cloud:admin`) and sees its creator''s events; the whole organization''s with `cloud:admin` or
        `team:read`. Anything else: 403 `forbidden`.


        **Resuming.** Send `Last-Event-ID` (an `EventSource` does it by itself) or `?after=`; the header wins. Without
        either the stream starts at the newest event; `after=0` starts at the oldest retained one. A cursor ahead of the
        organization''s events is 400 `invalid_cursor`. Events are kept 7 days: when the cursor is older than the oldest
        kept event, `event: gap` with `{"oldestSeq": n}` comes first, then the stream goes on from there.
        `?types=a,b` keeps only those types (400 `invalid_event_type` for an unknown one, at most 64). Keep-alive
        comments every 15 s, `retry: 2000`; the credential is checked again every 15 s and the stream ends with
        `event: denied` once it stopped being valid. It never ends otherwise: reconnect from the last `id`.'
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        description: The `seq` of the last event handled; wins over `after`.
        schema:
          type: string
      - name: after
        in: query
        required: false
        description: The `seq` of the last event handled (0 replays every retained event).
        schema:
          type: integer
          format: int64
      - name: types
        in: query
        required: false
        description: Comma-separated event types to keep.
        schema:
          type: string
      responses:
        '200':
          description: Server-sent events
          content:
            text/event-stream:
              x-ostrom-status: planned
              schema:
                type: string
              x-ostrom-event-data:
                $ref: '#/components/schemas/OrgEvent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
