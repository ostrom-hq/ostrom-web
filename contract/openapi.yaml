        the session's person or an agent token of its launch (scope `sessions:write` or the agent token's): another
        person, or another launch's agent token, gets 403; an unknown segment, or one of another organization, 404. Reports are applied one at a time per segment. A report observed before the stored
        one changes nothing (`superseded: true`). A repeated state keeps its time (`since`). 409 `session_ended` once
        the segment ended (a lost one too: its launcher reports to the segment it reopens). 400
        `invalid_session_activity` for another state or an `observedAt` that is not a date-time. Not audited, like a
