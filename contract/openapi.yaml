  /api/v1/analysis/state:
    get:
      operationId: getAnalysisState
      tags:
      - analysis
      summary: Snapshot of the analysis
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisState'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/analysis/replay:
    post:
      operationId: startReplay
      tags:
      - analysis
      summary: Replay the last 30 days of pull requests under the rules (simulation)
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                required:
                - runId
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      operationId: getReplay
      tags:
      - analysis
      summary: Replay results
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: {}
                required:
                - items
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tasks:
    get:
      operationId: listTasks
      tags:
      - analysis
      summary: Tasks proposed by the analysis
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  next:
                    type: string
                required:
                - items
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/tasks/{id}/run:
    post:
      operationId: runTask
      tags:
      - analysis
      summary: Run a proposed task under the rules (nothing is pushed)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An Ostrom token (CLI, browser session or service key)
  responses:
    Error:
      description: A refusal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ActivityActor:
      type: object
      description: Who did it
      properties:
        kind:
          type: string
        name:
          type: string
      required:
      - kind
      - name
      x-ostrom-kotlin: pending
    ActivityItem:
      type: object
      description: 'A line of the activity feed (kind: session.started, session.ended, gate.requested, gate.decided, check.passed,
        check.failed, workflow.changed; clients keep an unknown kind as UNKNOWN)'
      properties:
        id:
          type: string
        at:
          type: string
        kind:
          type: string
        actor:
          $ref: '#/components/schemas/ActivityActor'
        summary:
          type: string
        repo:
          type: string
        costUsd:
          type: number
        approvalId:
          type: string
        gateId:
          type: string
        sessionId:
          type: string
      required:
      - id
      - at
      - kind
      - actor
      - summary
      x-ostrom-kotlin: pending
    AgentEvent:
      type: string
      enum:
      - SessionStart
      - UserPromptSubmit
      - PreToolUse
      - PostToolUse
      - Stop
      - SessionEnd
    AnalysisState:
      type: object
      description: Snapshot of the organization analysis
      properties:
        phase:
          type: string
        progress:
          type: number
        repos:
          type: array
          items:
            $ref: '#/components/schemas/Repo'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
        failure:
          type: object
          additionalProperties:
            type: string
      required:
      - repos
      - rules
      - workflows
      x-ostrom-kotlin: pending
    AnswerApprovalRequest:
      type: object
      description: 'Answers an approval. The answer is refused (409) when [shownDigest] is not the digest of what the approval
        shows now:'
      properties:
        answer:
          $ref: '#/components/schemas/ApprovalAnswer'
        shownDigest:
          type: string
        comment:
          type: string
      required:
      - answer
      - shownDigest
    ApiError:
      type: object
      description: The error body of every refusal
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    Approval:
      type: object
      description: 'A request for a yes, shown to an approver. It is bound to what was shown: [shownDigest] is the digest
        of the title,'
      properties:
        id:
          type: string
        group:
          type: string
        workflowId:
          type: string
        taskId:
          type: string
        title:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        repo:
          type: string
        sha:
          type: string
        commits:
          type: array
          items:
            type: string
        commitDetails:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalCommit'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalCheck'
        requestedFrom:
          type: string
        channel:
          type: string
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        decidedBy:
          type: string
        decidedAt:
          type: string
        shownDigest:
          type: string
        askedBy:
          type: array
          items:
            type: string
        selfApproved:
          type: boolean
        expiresAt:
          type: string
      required:
      - id
      - title
      - requestedFrom
      - channel
      - status
      - shownDigest
    ApprovalAnswer:
      type: string
      enum:
      - approve
      - reject
    ApprovalCheck:
      type: object
      description: A CI check shown with an approval
      properties:
        name:
          type: string
        state:
          $ref: '#/components/schemas/CheckState'
        url:
          type: string
      required:
      - name
      - state
    ApprovalCommit:
      type: object
      description: A commit shown with an approval
      properties:
        sha:
          type: string
        title:
          type: string
        author:
          type: string
        url:
          type: string
      required:
      - sha
      - title
    ApprovalStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - expired
    Artifact:
      type: object
      description: A published page or file set, behind the login
      properties:
        id:
          type: string
        title:
          type: string
        owner:
          type: string
        access:
          type: string
        latestVersion:
          type: integer
        url:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - title
      - owner
      - access
      - latestVersion
      - url
      - createdAt
      - updatedAt
      x-ostrom-kotlin: pending
    ArtifactType:
      type: string
      enum:
      - skill
      - context
      - hook
      - script
      - mcp
      - approval
      - notify
      - subagent
      - receipt
    ArtifactVersion:
      type: object
      description: A version of an artifact
      properties:
        number:
          type: integer
        files:
          type: array
          items:
            type: string
        createdAt:
          type: string
        createdBy:
          type: string
      required:
      - number
      - files
      - createdAt
      - createdBy
      x-ostrom-kotlin: pending
    AuditEvent:
      type: object
      description: An audit line
      properties:
        id:
          type: string
        at:
          type: string
        event:
          type: string
        actor:
          type: string
        subject:
          type: string
        meta:
          type: object
          additionalProperties: {}
      required:
      - id
      - at
      - event
      - actor
      - subject
      x-ostrom-kotlin: pending
    AuthSession:
      type: object
      description: A signed-in browser or device session
      properties:
        id:
          type: string
        createdAt:
          type: string
        lastSeenAt:
          type: string
        device:
          type: string
        current:
          type: boolean
      required:
      - id
      - createdAt
      - current
      x-ostrom-kotlin: pending
    AuthToken:
      type: object
      description: A token issued to a developer or a service
      properties:
        token:
          type: string
        login:
          type: string
        expiresAt:
          type: string
        scopes:
          type: array
          items:
            type: string
      required:
      - token
      - login
      - scopes
      x-ostrom-kotlin: pending
    AuthUser:
      type: object
      description: The signed-in person
      properties:
        login:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
      required:
      - login
      x-ostrom-kotlin: pending
    Automation:
      type: object
      description: 'An automation: a cron or a signed webhook that starts a workflow run or an agent session'
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        enabled:
          type: boolean
        trigger:
          $ref: '#/components/schemas/AutomationTrigger'
        action:
          $ref: '#/components/schemas/AutomationAction'
        variables:
          type: array
          items:
            $ref: '#/components/schemas/AutomationVariable'
        samplePayload: {}
        overlap:
          type: string
        maxRunsPerDay:
          type: integer
        webhookUrl:
          type: string
        version:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - name
      - owner
      - enabled
      - trigger
      - action
      - version
      - createdAt
      - updatedAt
    AutomationAction:
      type: object
      description: 'What an automation starts: a workflow run, or a cloud agent session with a prompt'
      properties:
        workflowId:
          type: string
        prompt:
          type: string
        agent:
          type: string
        model:
          type: string
        effort:
          type: string
        maxRuntimeMinutes:
          type: integer
    AutomationTrigger:
      type: object
      description: The trigger of an automation
      properties:
        kind:
          $ref: '#/components/schemas/AutomationTriggerKind'
        cron:
          type: string
        timezone:
          type: string
        catchup:
          type: string
        catchupGraceMinutes:
          type: integer
      required:
      - kind
    AutomationTriggerKind:
      type: string
      enum:
      - cron
      - webhook
    AutomationVariable:
      type: object
      description: A variable read from a webhook payload
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
        values:
          type: array
          items:
            type: string
        maxLength:
          type: integer
        required:
          type: boolean
        sensitive:
          type: boolean
      required:
      - name
      - path
      - type
    Budget:
      type: object
      description: A spending limit
      properties:
        scope:
          type: string
        subject:
          type: string
        usdPerMonth:
          type: number
        usdPerDay:
          type: number
        hardStop:
          type: boolean
      required:
      - scope
      - hardStop
      x-ostrom-kotlin: pending
    BudgetOverride:
      type: object
      description: A dated exception to a daily allocation
      properties:
        id:
          type: string
        member:
          type: string
        usd:
          type: number
        expiresAt:
          type: string
        reason:
          type: string
        createdBy:
          type: string
        revokedAt:
          type: string
      required:
      - id
      - member
      - usd
      - expiresAt
      - reason
      - createdBy
      x-ostrom-kotlin: pending
    Capacity:
      type: object
      description: Remaining capacity of the shared subscriptions
      properties:
        accounts:
          type: array
          items:
            type: object
            additionalProperties: {}
        pools:
          type: array
          items:
            type: object
            additionalProperties: {}
        computedAt:
          type: string
      required:
      - accounts
      - pools
      - computedAt
      x-ostrom-kotlin: pending
    CheckOutcome:
      type: string
      enum:
      - passed
      - failed
      - timeout
      - skipped
    CheckRun:
      type: object
      description: A run of a check script, reported by the launcher. A failed enforced check blocks the action it guards
      properties:
        id:
          type: string
        at:
          type: string
        sessionId:
          type: string
        digest:
          type: string
        version:
          type: string
        nodeId:
          type: string
        scriptId:
          type: string
        scriptSha:
          type: string
        tampered:
          type: boolean
        mode:
          $ref: '#/components/schemas/PackageMode'
        exit:
          type:
          - integer
          - 'null'
        durationMs:
          type: integer
        head:
          type: string
        cached:
          type: boolean
        sandbox:
          type: string
        outputTail:
          type: string
        dev:
          type: string
        repo:
          type: string
      required:
      - id
      - at
      - digest
      - nodeId
      - scriptId
      - mode
      - exit
      - dev
    CheckState:
      type: string
      enum:
      - success
      - failure
      - pending
      - skipped
    CloudSession:
      type: object
      description: An agent session run on a runner
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        agent:
          type: string
        model:
          type: string
        status:
          type: string
        runnerId:
          type: string
        runId:
          type: string
        automationId:
          type: string
        createdAt:
          type: string
        endedAt:
          type: string
      required:
      - id
      - owner
      - agent
      - status
      - createdAt
      x-ostrom-kotlin: pending
    CompiledHook:
      type: object
      description: 'A hook rule: when the agent event fires on a matching tool call, run the check, ask the gate or send the
        notification'
      properties:
        id:
          type: string
        nodeId:
          type: string
        workflowId:
          type: string
        kind:
          $ref: '#/components/schemas/WorkflowNodeKind'
        event:
          $ref: '#/components/schemas/AgentEvent'
        tools:
          type: array
          items:
            type: string
        patterns:
          type: array
          items:
            type: string
        classes:
          type: array
          items:
            type: string
        mode:
          $ref: '#/components/schemas/PackageMode'
        why:
          type: string
        scriptId:
          type: string
        notifyId:
          type: string
        order:
          type: integer
        suggested:
          type: boolean
      required:
      - id
      - nodeId
      - workflowId
      - kind
      - event
      - tools
      - patterns
      - classes
      - mode
      - order
    CompiledNode:
      type: object
      description: What a workflow node produces in the session
      properties:
        id:
          type: string
        workflowId:
          type: string
        workflowName:
          type: string
        kind:
          $ref: '#/components/schemas/WorkflowNodeKind'
        label:
          type: string
        mode:
          $ref: '#/components/schemas/PackageMode'
        produces:
          type: array
          items:
            $ref: '#/components/schemas/Produced'
        trigger:
          $ref: '#/components/schemas/CompiledTrigger'
        artifacts:
          type: array
          items:
            type: string
      required:
      - id
      - workflowId
      - workflowName
      - kind
      - label
      - mode
      - produces
      - artifacts
    CompiledNotify:
      type: object
      description: A notification a notify node sends, from the server
      properties:
        id:
          type: string
        nodeId:
          type: string
        workflowId:
          type: string
        channel:
          type: string
        message:
          type: string
        mode:
          $ref: '#/components/schemas/PackageMode'
        suggestedChannel:
          $ref: '#/components/schemas/SuggestedChannel'
      required:
      - id
      - nodeId
      - workflowId
      - channel
      - message
      - mode
    CompiledScript:
      type: object
      description: A script a check node runs
      properties:
        id:
          type: string
        nodeId:
          type: string
        workflowId:
          type: string
        label:
          type: string
        where:
          $ref: '#/components/schemas/RunLocation'
        path:
          type: string
        sha256:
          type: string
        command:
          type: string
        timeoutSec:
          type: integer
        network:
          type: boolean
        mode:
          $ref: '#/components/schemas/PackageMode'
        approval:
          $ref: '#/components/schemas/ScriptApproval'
        suggested:
          $ref: '#/components/schemas/ScriptSuggestion'
      required:
      - id
      - nodeId
      - workflowId
      - label
      - where
      - path
      - sha256
      - command
      - timeoutSec
      - network
      - mode
      - approval
    CompiledTrigger:
      type: object
      description: The trigger of a check or notify node
      properties:
        from:
          type: string
        gateNodeId:
          type: string
        classes:
          type: array
          items:
            type: string
        patterns:
          type: array
          items:
            type: string
        resolved:
          type: array
          items:
            type: string
      required:
      - from
      - classes
      - patterns
      - resolved
    Decision:
      type: object
      description: A signed decision on something else than a gate (a rule, a workflow, an owner, a policy)
      properties:
        id:
          type: string
        at:
          type: string
        by:
          type: string
        subject:
          $ref: '#/components/schemas/DecisionSubject'
        action:
          type: string
        before: {}
        after: {}
        receiptId:
          type: string
      required:
      - id
      - at
      - by
      - subject
      - action
      - receiptId
    DecisionSubject:
      type: object
      description: The subject of a decision
      properties:
        kind:
          type: string
        id:
          type: string
        label:
          type: string
      required:
      - kind
      - id
    Deliverable:
      type: object
