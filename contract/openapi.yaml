    OrgEvent:
      type: object
      description: 'One event of the organization''s feed (`GET /api/v1/events`), and the `data` of a webhook delivery'
      properties:
        seq:
          type: integer
          format: int64
          description: The organization's sequence, gap-free and increasing
        type:
          type: string
          description: "The event type, also the SSE `event:` field (`cloud.wait.created`); an open list. Planned, until
            ostrom-server publishes them: the hosted MCP commands (TeamCode's `mcp.stdio.*`, a hosted stdio server's
            process, see `GET /api/v1/mcp/hosted`) publish,
            with the subject `mcp`: `mcp.stdio.failed`, a process starts failing (`failed` or `backoff`), once per
            failure streak (retries, `failed` becoming `backoff` and an expired backoff stay in it until a start
            succeeds), with `data` `{server, memberId?, state, failure}`; `mcp.stdio.recovered`, the process is `ready`
            again after a failure, with the same `data`, `failure` naming what it recovered from; and
            `mcp.unreachable`, the state sweep could not reach the MCP host (or the host refused it) while the
            organization has hosted servers, at most one every ten minutes, with `data` `{reason}` (`unreachable`, no
            answer, or `refused`, another token or protocol version). `subjectId` is the server's name, followed by `/`
            and the member's id for a per-member process, and empty for `mcp.unreachable`. A per-member process's events
            belong to its member (`memberId`); a shared process's and `mcp.unreachable` belong to nobody (the event's `memberId` is
            absent, and so is `data.memberId`), so only owners and administrators see them (a webhook receives all of
            them). None carries a secret, an argument or an
            output. They follow the transition by up to a minute (the sweep runs once a minute): a failure that
            recovers between two sweeps is not seen"
        subject:
          type: string
          description: What the event is about (`session`, `wait`, `workflow_run`, `mcp`...)
        subjectId:
          type: string
        memberId:
          type: string
          description: The member the subject belonged to when it happened; absent for an event of the whole organization
        at:
          type: string
          description: ISO instant of the change
        data:
          type: object
          additionalProperties: {}
          description: The type's facts, identifiers and short labels only
      required:
      - seq
      - type
      - subject
      - subjectId
      - at
      - data
