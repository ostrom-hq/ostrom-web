      summary: Budgets
      description: "Read by a browser session, or by a token with `budgets:read` made on the console. Never by the
        token of `ostrom login`, nor by that of `ostrom login --admin`: the limits of every member stay off the
        CLI's tokens (SECURITY-AUDIT S2-03)"
      responses:
