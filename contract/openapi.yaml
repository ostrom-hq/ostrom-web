          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactTicket'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactTicket'
        '400':
