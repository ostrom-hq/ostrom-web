    Webhook:
      type: object
      description: 'An outgoing webhook of the organization. Each event of `types` is POSTed to `url` as JSON
        `{id, type, createdAt, data}`, `data` being the `OrgEvent` (`{"message": ...}` for `webhook.test`), with the
        headers `Ostrom-Delivery` (one id per event and webhook, the same on every retry: deduplicate on it),
        `Ostrom-Event`, `Ostrom-Timestamp` (Unix seconds) and `Ostrom-Signature: v1=<hex>`, the HMAC-SHA256 of
        `<timestamp>.<raw body>` keyed with the whole `whsec_` secret. A receiver compares in constant time and rejects a
        timestamp more than five minutes old. The body is fixed when the event is queued: every retry sends the same
        bytes, only the timestamp and the signature are fresh. A 2xx within 10 seconds is a delivery; a network error, a
        timeout, a 5xx, 408 or 429 is retried, 8 attempts in all, after 10 s, 30 s, 2 min, 10 min, 30 min, 2 h and 6 h;
        any other answer (a 4xx, a redirect) is final. A delivery still pending after 24 hours is given up (`expired`).
        Twenty final failures in a row disable the webhook (`too_many_failures`); a success resets the count. Deliveries
        are not ordered: use `data.seq` when order matters.'
      properties:
        id:
          type: string
        url:
          type: string
        types:
          type: array
          items:
            type: string
          description: The event types it receives, sorted
        description:
          type: string
        enabled:
          type: boolean
        disabledReason:
          type: string
          description: '`disabled` (paused by a person) or `too_many_failures`; absent while enabled'
        createdBy:
          type: string
          description: The member who created it
        createdAt:
          type: string
        updatedAt:
          type: string
        version:
          type: integer
          description: Sent back by `updateWebhook`
        consecutiveFailures:
          type: integer
          description: Final failures in a row since the last success
      required:
      - id
      - url
      - types
      - description
      - enabled
      - createdBy
      - createdAt
      - updatedAt
      - version
      - consecutiveFailures
