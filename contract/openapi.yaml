    post:
      operationId: createWait
      x-ostrom-status: served
      tags:
      - waits
      summary: Ask a person (agent ask_human); Idempotency-Key header
      description: "`assignee` is a member id or a username (at most 64 characters; an id wins over a username that
        spells it), the caller by default; an unknown one is 400. A member asks in a session only when they run it
        (403 `wait_session_owner_only`, an administrator included) and while it runs (409 `session_not_running`).
        A `time` or `event` wait (`resolver`) is asked by an agent in its session only, and resolves by itself: at
        `dueAt`, or when its `eventUrl` is called, or at `timeoutAt`; the session's Stop hook wakes the agent with it
        (`POST /api/v1/waits/wake`). Nobody answers it (409 `resolves_by_itself`); its asker cancels it."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                runId:
                  type: string
                assignee:
                  type: string
                  description: A member id or a username
                kind:
                  type: string
                question:
                  $ref: '#/components/schemas/WaitSpec'
                resolver:
                  type: string
                  description: "`human` by default. `time` or `event`: a wait that resolves by itself, asked by an agent
                    in its session (agent token) for that session only, with a title and no fields, actions or other
                    assignee"
                  enum:
                  - human
                  - time
                  - event
                at:
                  type: string
                  format: date-time
                  description: "`time`: the instant it resolves, ISO-8601 UTC, in the future and at most 30 days away
                    (exactly one of `at` and `after`)"
                after:
                  type: integer
                  format: int64
                  minimum: 30
                  maximum: 2592000
                  description: "`time`: seconds from now, 30 to 30 days (exactly one of `at` and `after`)"
                source:
                  type: string
                  description: "`event`: where the event comes from, `webhook` (the only value, by default)"
                  enum:
                  - webhook
                timeoutSeconds:
                  type: integer
                  format: int64
                  minimum: 30
                  maximum: 604800
                  description: "`event`: how long it waits before it resolves as timed out (86 400 by default)"
                resumeMessage:
                  type: string
                  maxLength: 2000
                  description: "`time` or `event`: a line added to the message that wakes the session"
              required:
              - question
      responses:
        '200':
          description: 'A replay of the same `Idempotency-Key`, answered with `Idempotency-Replayed: true`: the
            wait first created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wait'
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wait'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
