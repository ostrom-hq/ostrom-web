        `HKDF-SHA256(ECDH(ephemeral private, phone public), salt = ephemeral point | phone point, info =
        "ostrom-push-v1", 32 bytes)`, both points as 65-byte uncompressed SEC1 points (`0x04 | x | y`, the phone's
        read from its SubjectPublicKeyInfo), its plaintext this object's JSON, `v` always written. On iOS a generic alert shows when the
        notification service extension cannot decrypt it.
      properties:
        v:
          type: integer
          description: The format, 1
        id:
          type: string
        origin:
          type: string
          description: The server's public URL; with orgId and memberId, which signed-in account it is for
        orgId:
          type: string
        memberId:
          type: string
        kind:
          type: string
          description: '`approval` (a request waits for the member''s yes), a notification kind (`waiting`,
            `turn_completed`, `turn_failed`, `session_failed`) or `test`'
        title:
          type: string
        body:
          type: string
        approvalId:
          type: string
          description: The request a tap opens, for `approval`
        sessionId:
          type: string
          description: The session a tap opens
        waitId:
          type: string
          description: The wait a tap opens, for a wait outside a session
        at:
          type: integer
          format: int64
          description: Unix milliseconds
      required:
      - id
      - origin
      - orgId
      - memberId
      - kind
      - title
      - body
      - at
