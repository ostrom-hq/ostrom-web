# The Ostrom API contract (OpenAPI 3.1). Source of the TypeScript types; the Kotlin models are checked against it.
openapi: 3.1.0
info:
  title: Ostrom API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: 'The contract of the Ostrom server, owned by ostrom-core. Schemas without `x-ostrom-kotlin: pending` have a
    Kotlin model in `run.ostrom.core.api.models` with the same JSON shape (checked by `api-types/scripts/check-contract.mjs`).
    TypeScript types are generated from this file (`@ostrom-hq/api-types`).

    Every operation carries `x-ostrom-status`: `served` when the server on `main` of ostrom-server answers it, `planned`
    otherwise. The public API reference lists the `served` ones only. A server PR that serves a route sets its operation
    to `served` here, in the same change set.

    A browser signs in with the `__Host-ostrom_session` cookie (HttpOnly, Secure, SameSite=Lax, `Path=/`, no `Domain`;
    plain `ostrom_session` only on a plain-HTTP development server); the CLI, the app, devices, runners and service keys
    send a bearer token. With the cookie, every request that changes something (POST, PUT, PATCH, DELETE) also sends
    `X-CSRF-Token`, equal to the readable `__Host-ostrom_csrf` cookie, and comes from an allowed `Origin` (the
    console''s, or `OSTROM_ALLOWED_ORIGINS`), or is refused with 403.

    Every route is under `/api/v1`, except `/health` and the incoming webhooks (`/webhooks/stripe`, `/webhooks/github`,
    `/webhooks/slack`), each authenticated by its sender''s signature.

    A route without `orgs/{orgId}` in its path acts in the caller''s organization. A person who is a member of several
    organizations names it with the `Ostrom-Org` header (the organization''s id); without it they get 409 with
    `error.type` `org_required`. With exactly one active membership the header may be left out. `getMe` and
    `listMyOrganizations` never need it.

    A resource of another organization, or of an organization the caller is not a member of, answers 404 exactly
    like a resource that does not exist, never 403: no answer tells "exists elsewhere" from "does not exist". A 403
    only refuses what the caller can already see in their own organization (a missing scope, a role, a token where a
    browser session is needed). A costly read or a sign-in step may answer 429 `rate_limited`; a read throttled per
    caller also sends `Retry-After`.'
servers:
- url: https://{host}
  variables:
    host:
      default: localhost:4317
security:
- bearer: []
- sessionCookie: []
tags:
- name: admin
- name: analysis
- name: approvals
- name: artifacts
- name: audit
- name: auth
- name: automations
- name: billing
- name: budgets
- name: checks
- name: delivery
- name: events
- name: gates
- name: github
- name: governance
- name: import
- name: inference
- name: mcp
- name: memory
- name: meta
- name: notifications
- name: organization
- name: packages
- name: receipts
- name: rules
- name: runners
- name: secrets
- name: sessions
- name: sharing
- name: todos
- name: waits
- name: webhooks
- name: workflows
paths:
  /health:
    get:
      operationId: healthRoot
      x-ostrom-status: served
      tags:
      - meta
      summary: Liveness, outside the API prefix for probes (same answer as `/api/v1/health`)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/health:
    get:
      operationId: health
      x-ostrom-status: served
      tags:
      - meta
      summary: Liveness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /ready:
    get:
      operationId: ready
      x-ostrom-status: served
      tags:
      - meta
      summary: "Readiness probe, unauthenticated: 200 `ready` when every check passes; 503 `draining` once the server stops
        taking traffic, or `degraded`"
      security: []
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Draining or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/instance:
    get:
      operationId: getInstance
      x-ostrom-status: served
      tags:
      - meta
      summary: The instance and the key it signs with now; unauthenticated, clients verify signatures before signing in
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
  /api/v1/instance/keys:
    get:
      operationId: listInstanceKeys
      x-ostrom-status: served
      tags:
      - meta
      summary: Every signing key the instance has used, oldest first
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstanceSigningKey'
                required:
                - keys
  /api/v1/admin/instance-admins:
    get:
      operationId: listInstanceAdmins
      x-ostrom-status: served
      tags:
      - admin
      summary: The administrators of the instance
      description: 'A person only (a browser session, the unlocked app or the CLI''s sign-in) who administers the
        instance; no key reaches it, whatever its scopes (TeamCode''s dashboard settings are an interactive
        administrator''s). The instance''s administrators configure what serves every organization: cloud-session
        clusters, the GitHub App, sign-in providers, mail, push, provider keys, analytics and billing (TeamCode
        `docs/artifacts.md` "Storage and settings", `docs/cloud-sessions.md` "Resources"). The person who used the
        instance''s setup link (`ostrom-server bootstrap`) is the first one; the former `OSTROM_INSTANCE_ADMINS` is
        imported once. 403 `instance_admin_required` for anyone else'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceAdminList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: addInstanceAdmin
      x-ostrom-status: served
      tags:
      - admin
      summary: Make a person an administrator of the instance
      description: 'A person who administers the instance. `email` is a verified address of an account of the instance
        (404 `account_not_found` otherwise, the same answer for an unknown and an unverified address). Adding an
        administrator twice changes nothing. Written to the instance''s audit log'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInstanceAdminRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceAdminList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/admin/instance-admins/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: removeInstanceAdmin
      x-ostrom-status: served
      tags:
      - admin
      summary: Remove an administrator of the instance
      description: 'A person who administers the instance. The last administrator is never removed (409
        `last_instance_admin`); a person who is not one gets 404 `instance_admin_not_found`. Written to the
        instance''s audit log'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/admin/settings:
    get:
      operationId: listInstanceSettings
      x-ostrom-status: served
      tags:
      - admin
      summary: Every section of the instance's settings
      description: 'A person who administers the instance. The sections the server knows, each as `getInstanceSettings`
        answers it: the settings that serve every organization, stored in PostgreSQL. Nothing here is set in the
        environment or the Helm chart: only what the server needs to start is (database, secrets key, public URLs,
        listen address, trusted proxies, per-replica ceilings, the MCP host). Secrets are never returned'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSettingsList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/admin/settings/{section}:
    parameters:
    - name: section
      in: path
      required: true
      description: The section, a key such as `mail`, `push` or `google`
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,39}$'
    get:
      operationId: getInstanceSettings
      x-ostrom-status: served
      tags:
      - admin
      summary: One section of the instance's settings
      description: 'A person who administers the instance. Plain fields come back as stored; a secret field only as
        `configured` (TeamCode''s write-only secrets: sealed with the server''s secrets key, AES-256-GCM, bound to
        their section and field, never returned or shown again). A section the server does not know is 404
        `settings_section_not_found`'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSettings'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    put:
      operationId: saveInstanceSettings
      x-ostrom-status: served
      tags:
      - admin
      summary: Save one section of the instance's settings
      description: 'A person who administers the instance. `version` is the one replaced (0 before the first save; 409
        `settings_conflict` otherwise). `values` holds every plain field of the section, an absent or empty one unset;
        a field the section does not have, or a value its rule refuses, is 400 `invalid_settings` naming the field,
        never echoing a secret. `secrets` is write-only: a field absent or empty keeps the stored secret, a value
        replaces it, `null` removes it. Every save is written to the instance''s audit log with the fields changed,
        never their values; every replica uses the new settings within 30 seconds'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveInstanceSettingsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceSettings'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/capabilities:
    get:
      operationId: capabilities
      x-ostrom-status: served
      tags:
      - meta
      summary: The API version this server speaks, its version and the features it serves
      description: "Read by every client after signing in, with any credential of a person, an agent or a service (CLI or app
        token, console session, device, agent token or service key; runner tokens are refused). A client refuses a
        server whose `apiVersion` it does not speak, and hides or refuses a feature whose key is absent from
        `features`: a key is listed only when the server serves that feature and it is configured on this instance
        (billing only with Stripe, push notifications only with a push sender…), never for a `planned` operation. Kept
        behind authentication, like TeamCode's: an anonymous call is refused with 401 `unauthorized`, which tells a
        client it reached an Ostrom server and should sign in next."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/github/start:
    get:
      operationId: startGithubLogin
      x-ostrom-status: planned
      description: "Served through `startOAuthLogin` (`provider=github`), with the mobile PKCE parameters since
        ostrom-server#75. This literal path stays `planned` for the served check, which lists the `{provider}` route."
      tags:
      - auth
      summary: 'Start the GitHub OAuth sign-in. Browser: `redirect`. Mobile app: `redirect_uri` (ostrom://auth/callback),
        `state`, PKCE `code_challenge` and `code_challenge_method=S256`; the server redirects back with a one-time `code`'
      parameters:
      - name: redirect
        in: query
        required: false
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/mobile/token:
    post:
      operationId: mobileToken
      x-ostrom-status: served
      tags:
      - auth
      summary: Exchange the one-time code of the mobile sign-in (PKCE) for a token
      description: "The code works once (a wrong verifier spends it), for 60 s, with the exact `redirectUri` of the start.
        The token (`osm_…`, 30 days) answers a gate only within 5 minutes of `unlockMobileApp` (planned: a yes to a
        high-risk action, with an unlock bound to that approval, see `unlockMobileApp.requestId`). A person keeps 5
        phones: a sixth sign-in revokes the oldest app token."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileToken'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /api/v1/auth/mobile/unlock:
    post:
      operationId: unlockMobileApp
      x-ostrom-status: served
      tags:
      - auth
      summary: "Record the phone's biometric unlock: the app's token answers a gate for 5 minutes after it (S2-54);
        planned: a yes to a high-risk action takes an unlock bound to its request (`requestId`)"
      description: "The app's token only (403 for a browser session or another token, or a wrong key)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileUnlockRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileUnlock'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /api/v1/auth/github/callback:
    get:
      operationId: githubLoginCallback
      x-ostrom-status: planned
      description: "Served through `oauthLoginCallback` (`provider=github`), browser and mobile sign-ins, since
        ostrom-server#75. This literal path stays `planned` for the served check, which lists the `{provider}` route."
      tags:
      - auth
      summary: GitHub OAuth callback
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/providers:
    get:
      operationId: listSignInMethods
      x-ostrom-status: served
      tags:
      - auth
      summary: "The sign-in methods this instance offers (`github`, `google`, `email`)"
      security: []
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInMethods'
  /api/v1/auth/signup-grant:
    post:
      operationId: grantSignUp
      x-ostrom-status: served
      tags:
      - auth
      summary: "Before signing in on an invite-only instance, the console presents the token of the instance's setup link
        (`/setup#token=osb_…`, printed by `ostrom-server bootstrap`) or of an invitation (`/invite#token=…`): the
        server checks it and sets the `ostrom_signup` cookie (HttpOnly, `Path=/api/v1/auth`, 1 hour), which lets the
        sign-in that follows in this browser create the person's account. The setup link is used once, by that
        account, which may then create the instance's organizations. The `Origin` header must be the console's"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpGrantRequest'
      responses:
        '204':
          description: "The token is valid: the cookie is set"
          headers:
            Set-Cookie:
              description: '`ostrom_signup` (HttpOnly, SameSite=Lax, `Path=/api/v1/auth`)'
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: "forbidden: the call does not come from the console (its `Origin` header is missing or another)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: "not_found: the token is unknown, used or expired (ask for a new setup link or invitation)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /api/v1/auth/{provider}/start:
    get:
      operationId: startOAuthLogin
      x-ostrom-status: served
      tags:
      - auth
      summary: "Send the browser to the provider's consent page (sets the state cookie). On a refusal, a redirect to the
        console's `/login?error=` (`unavailable`, `rate_limited`, `expired`, `refused`, `link_required`,
        `identity_taken`, `signup_closed`)"
      parameters:
      - name: provider
        in: path
        required: true
        description: "`github` or `google`"
        schema:
          type: string
      - name: redirect
        in: query
        required: false
        description: "The console path to return to"
        schema:
          type: string
      - name: reauth
        in: query
        required: false
        description: "Sign in again before a yes: the provider asks again"
        schema:
          type: boolean
      - name: redirect_uri
        in: query
        required: false
        description: "Mobile app: its deep link, exactly `ostrom://auth/callback`. With `state`, `code_challenge` and
          `code_challenge_method=S256`, the callback returns a one-time `code` (or an `error`) and the app's `state` to
          it; any invalid mobile parameter answers 400"
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: "Mobile app: its state, returned with the code"
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        description: "Mobile app: the S256 PKCE challenge (43 characters)"
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        description: "Mobile app: `S256` only"
        schema:
          type: string
      security: []
      responses:
        '302':
          description: "Redirect"
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/{provider}/callback:
    get:
      operationId: oauthLoginCallback
      x-ostrom-status: served
      tags:
      - auth
      summary: "Where the provider sends the browser back: sets the session cookies and redirects to the console (or to
        `/login?error=`, `signup_closed` when the instance creates no account for this person: see `SignInMethods.signUp`). For a sign-in the phone app started, an error redirects to the app's deep link; a code is
        answered as a page whose link to the deep link the person taps"
      parameters:
      - name: provider
        in: path
        required: true
        description: "`github` or `google`"
        schema:
          type: string
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '200':
          description: "A mobile sign-in's code: the page that names who signed in and links to the app's deep link
            (`ostrom://auth/callback?code=&state=`), on the person's tap; no script, never framed or cached"
          content:
            text/html:
              schema:
                type: string
        '302':
          description: "Redirect"
  /api/v1/auth/{provider}/link:
    post:
      operationId: linkSignInProvider
      x-ostrom-status: served
      tags:
      - auth
      summary: "A signed-in person (browser session and `X-CSRF-Token`) starts linking a provider to their account: the answer
        gives the consent page to open, the state cookie is set, and the callback links the identity"
      parameters:
      - name: provider
        in: path
        required: true
        description: "`github` or `google`"
        schema:
          type: string
      - name: redirect
        in: query
        required: false
        description: "The console path to return to"
        schema:
          type: string
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkStarted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /api/v1/auth/device:
    get:
      operationId: getDeviceLogin
      x-ostrom-status: served
      tags:
      - auth
      summary: "The pending `ostrom login` the person is about to answer (browser session only)"
      parameters:
      - name: userCode
        in: query
        required: true
        description: "The code the CLI shows"
        schema:
          type: string
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
    post:
      operationId: startDeviceLogin
      x-ostrom-status: served
      tags:
      - auth
      summary: Start the device flow (CLI sign-in)
      description: "Without a body, the ordinary sign-in of `ostrom login`. With `scopes`, `ostrom login --admin`: the
        governance write scopes no other token holds (S2-52, decision of 02/11/2026). The browser's page shows every
        scope its token will hold (`DeviceAuthorization.scopes`), only an owner or admin of the organisation may
        approve them, and the token that comes out is bound to that organisation, expires in 8 hours at most and is never refreshed. Each
        governance write it makes is recorded in the organisation's audit log before it happens. A server older than
        this answers an ordinary token, whose `AuthToken.scopes` tell the CLI."
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLoginStart'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCode'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /api/v1/auth/device/token:
    post:
      operationId: pollDeviceLogin
      x-ostrom-status: served
      tags:
      - auth
      summary: Exchange a confirmed device code for a token (RFC 8628 section 3.5). 428 `authorization_pending` while
        nobody approved it yet (poll again after the interval); 400 `slow_down` (poll less often), `access_denied` (the
        sign-in was refused) or `expired_token` (the code expired or was used; start again), in `error.type`; 200 with
        the token once approved
