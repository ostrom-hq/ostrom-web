      summary: "Read a session's todo"
      description: "The list with its items in order, the last proof of each, its hook events and `nextItemId`; `todo`
        is null while the session has none. Answers to drop requests are applied on this read (one read of the waits
        for every open drop request): yes drops the item, no or a cancelled wait puts it back to `todo`. Callers: the
        session's agent token (the token of its launch), confined to its own session, which it names in `sessionId`
        (400 `invalid_request` without it); the session's owner, a person, who names `sessionId` (400
        `invalid_request` without it); an owner or an administrator of the organization reads (`getSessionTodo`,
        `readTodoContext`) but never writes (403 `forbidden`). A service key or a runner token gets 403 `forbidden`.
        Another person's session, a session of another organization or an unknown one answers 404 `not_found`."
      parameters:
      - name: sessionId
        in: query
        required: false
        description: "The session (its id, or one of its segments `~r<n>`), as its owner or its agent token names it"
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTodo'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    post:
      operationId: createSessionTodo
      x-ostrom-status: served
      tags:
      - todos
      summary: "Create a session's todo, once per session"
      description: "The plan `reference`, optional `refs` and every item in order, each with a complete description
        and at least one typed check (`TodoCheck`). No check names a PR number or a version: the PR is found by the
        marker `startTodoItem` returns. 400 for an invalid list: `invalid_todo` (a text too long, a bad slug, more
        than 10 refs), `description_too_short` (a description outside 80 to 4 000 characters), `check_required` (an
        item without a typed check), `invalid_check` (a check missing a field of its type, a type this server does not
        know, a command timeout outside 1 to 120 seconds), `guessed_number` (a check naming a PR number or a version),
        `too_many_items` (more than 500), `duplicate_item`, `unknown_dependency`, `dependency_cycle`. 409
        `todo_exists` when the session already has one (`resetTodo` clears a closed one). Callers: the session's agent
        token (the token of its launch), confined to its own session, which it names in `sessionId` (400
        `invalid_request` without it); the session's owner, a person, who names `sessionId` (400 `invalid_request`
        without it); an owner or an administrator of the organization reads (`getSessionTodo`, `readTodoContext`) but
