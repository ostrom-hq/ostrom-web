    get:
      operationId: pendingWorkflowSession
      x-ostrom-status: served
      tags:
      - workflows
      summary: "Whether the session's agent step still waits for its delivery, for the Stop hook (`workflows.deliver.v1`)"
      description: "`needsAction` is true when the session has an unfinished run whose latest active visit is an agent
        visit bound to it and the session holds no open wait; it then names the run, the step's title and the form of
        its deliverable (never its schema or its instruction). The same credentials and session resolution as
        `deliverWorkflowSession`; the caller's own session that runs no step is 200 with `needsAction: false`. Writes
        nothing"
      parameters:
      - name: sessionId
        in: query
        required: false
        description: Required for a person or a key; an agent token's own session otherwise
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
