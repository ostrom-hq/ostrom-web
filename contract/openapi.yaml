      operationId: listArtifactVersions
      x-ostrom-status: served
      tags:
      - artifacts
      summary: Versions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersionPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    post:
      operationId: publishArtifactVersion
      x-ostrom-status: served
      tags:
      - artifacts
      summary: Publish a new version
      description: 'With `uploadId`, the commit of an upload: every file is either sent by that upload or already in
        the artifact''s folder (409 `artifact_blob_missing`), `baseVersion` must be the live version (409
        `artifact_conflict`, whose `current` is the live version), only the owner (and invited editors)
        publish (403). Planned: `quotaPublishesPerHour` (429 `artifact_rate_limited` with `Retry-After`), the byte
        quotas (409 `artifact_quota_exceeded`), versions beyond `maxVersionsPerArtifact` are pruned. Files are stored in the organization''s bucket, never in PostgreSQL; 409
        with the inactive reason while artifacts are inactive'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    $ref: '#/components/schemas/ArtifactFile'
                uploadId:
                  type: string
                  description: The upload whose files this commit uses (each file then by `sha256` and `size`)
                entry:
                  type: string
                  description: The page among `files` (`.html`, `.htm` or `.md`)
                baseVersion:
                  type: integer
                  minimum: 0
                  description: 'The version the publisher started from (0 for a draft): any other live version is
                    409 `artifact_conflict`'
                title:
                  type: string
                description:
                  type: string
                icon:
                  type: string
                access:
                  $ref: '#/components/schemas/ArtifactAccess'
              required:
              - files
      responses:
        '200':
          description: 'The same commit again within 10 minutes (same credential, base version and manifest digest):
            the version it made, `replayed` true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersion'
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVersion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: 'A refusal; for `artifact_conflict`, `current` is the live version, for the publisher to merge'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
