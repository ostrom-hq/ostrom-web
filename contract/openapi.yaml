# The Ostrom API contract (OpenAPI 3.1). Source of the TypeScript types; the Kotlin models are checked against it.
openapi: 3.1.0
info:
  title: Ostrom API
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: 'The contract of the Ostrom server, owned by ostrom-core. Schemas without `x-ostrom-kotlin: pending` have a
    Kotlin model in `dev.ostrom.core.api.models` with the same JSON shape (checked by `api-types/scripts/check-contract.mjs`).
    TypeScript types are generated from this file (`@ostrom-hq/api-types`).

    Every operation carries `x-ostrom-status`: `served` when the server on `main` of ostrom-server answers it, `planned`
    otherwise. The public API reference lists the `served` ones only. A server PR that serves a route sets its operation
    to `served` here, in the same change set.

    A browser signs in with the `__Host-ostrom_session` cookie (HttpOnly, Secure, SameSite=Lax, `Path=/`, no `Domain`;
    plain `ostrom_session` only on a plain-HTTP development server); the CLI, the app, devices, runners and service keys
    send a bearer token. With the cookie, every request that changes something (POST, PUT, PATCH, DELETE) also sends
    `X-CSRF-Token`, equal to the readable `__Host-ostrom_csrf` cookie, and comes from an allowed `Origin` (the
    console''s, or `OSTROM_ALLOWED_ORIGINS`), or is refused with 403.

    Every route is under `/api/v1`, except `/health` and the incoming webhooks (`/webhooks/stripe`, `/webhooks/github`,
    `/webhooks/slack`), each authenticated by its sender''s signature.

    A route without `orgs/{orgId}` in its path acts in the caller''s organization. A person who is a member of several
    organizations names it with the `Ostrom-Org` header (the organization''s id); without it they get 409 with
    `error.type` `org_required`. With exactly one active membership the header may be left out. `getMe` and
    `listMyOrganizations` never need it.'
servers:
- url: https://{host}
  variables:
    host:
      default: localhost:4317
security:
- bearer: []
- sessionCookie: []
tags:
- name: analysis
- name: approvals
- name: artifacts
- name: audit
- name: auth
- name: automations
- name: billing
- name: budgets
- name: checks
- name: delivery
- name: events
- name: gates
- name: github
- name: governance
- name: import
- name: inference
- name: mcp
- name: meta
- name: notifications
- name: organization
- name: packages
- name: receipts
- name: rules
- name: runners
- name: secrets
- name: sessions
- name: sharing
- name: waits
- name: webhooks
- name: workflows
paths:
  /health:
    get:
      operationId: healthRoot
      x-ostrom-status: served
      tags:
      - meta
      summary: Liveness, outside the API prefix for probes (same answer as `/api/v1/health`)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/health:
    get:
      operationId: health
      x-ostrom-status: served
      tags:
      - meta
      summary: Liveness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /ready:
    get:
      operationId: ready
      x-ostrom-status: served
      tags:
      - meta
      summary: "Readiness probe, unauthenticated: 200 `ready` when every check passes; 503 `draining` once the server stops
        taking traffic, or `degraded`"
      security: []
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Draining or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/instance:
    get:
      operationId: getInstance
      x-ostrom-status: served
      tags:
      - meta
      summary: The instance and the key it signs with now; unauthenticated, clients verify signatures before signing in
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
  /api/v1/instance/keys:
    get:
      operationId: listInstanceKeys
      x-ostrom-status: served
      tags:
      - meta
      summary: Every signing key the instance has used, oldest first
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstanceSigningKey'
                required:
                - keys
  /api/v1/capabilities:
    get:
      operationId: capabilities
      x-ostrom-status: planned
      tags:
      - meta
      summary: Capabilities of this server (feature keys and versions)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  capabilities:
                    type: array
                    items:
                      type: string
                required:
                - version
                - capabilities
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/github/start:
    get:
      operationId: startGithubLogin
      x-ostrom-status: planned
      description: "Served through `startOAuthLogin` (`provider=github`), with the mobile PKCE parameters since
        ostrom-server#75. This literal path stays `planned` for the served check, which lists the `{provider}` route."
      tags:
      - auth
      summary: 'Start the GitHub OAuth sign-in. Browser: `redirect`. Mobile app: `redirect_uri` (ostrom://auth/callback),
        `state`, PKCE `code_challenge` and `code_challenge_method=S256`; the server redirects back with a one-time `code`'
      parameters:
      - name: redirect
        in: query
        required: false
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/mobile/token:
    post:
      operationId: mobileToken
      x-ostrom-status: served
      tags:
      - auth
      summary: Exchange the one-time code of the mobile sign-in (PKCE) for a token
      description: "The code works once (a wrong verifier spends it), for 60 s, with the exact `redirectUri` of the start.
        The token (`osm_…`, 30 days) answers a gate only within 5 minutes of `unlockMobileApp`. A person keeps 5 phones:
        a sixth sign-in revokes the oldest app token."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                codeVerifier:
                  type: string
                redirectUri:
                  type: string
              required:
              - code
              - codeVerifier
              - redirectUri
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/AuthUser'
                  expiresAt:
                    type: string
                  unlockKey:
                    type: string
                    description: "Kept by the app behind the phone's biometrics (keychain item that requires them),
                      presented to `unlockMobileApp` before a yes; never sent anywhere else"
                required:
                - token
                - user
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/mobile/unlock:
    post:
      operationId: unlockMobileApp
      x-ostrom-status: served
      tags:
      - auth
      summary: "Record the phone's biometric unlock: the app's token answers a gate for 5 minutes after it (S2-54)"
      description: "The app's token only (403 for a browser session or another token, or a wrong key)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unlockKey:
                  type: string
              required:
              - unlockKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticatedAt:
                    type: string
                    format: date-time
                required:
                - authenticatedAt
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/github/callback:
    get:
      operationId: githubLoginCallback
      x-ostrom-status: planned
      description: "Served through `oauthLoginCallback` (`provider=github`), browser and mobile sign-ins, since
        ostrom-server#75. This literal path stays `planned` for the served check, which lists the `{provider}` route."
      tags:
      - auth
      summary: GitHub OAuth callback
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '302':
          description: Redirect
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/providers:
    get:
      operationId: listSignInMethods
      x-ostrom-status: served
      tags:
      - auth
      summary: "The sign-in methods this instance offers (`github`, `google`, `email`)"
      security: []
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInMethods'
  /api/v1/auth/{provider}/start:
    get:
      operationId: startOAuthLogin
      x-ostrom-status: served
      tags:
      - auth
      summary: "Send the browser to the provider's consent page (sets the state cookie). On a refusal, a redirect to the
        console's `/login?error=` (`unavailable`, `rate_limited`, `expired`, `refused`, `link_required`,
        `identity_taken`)"
      parameters:
      - name: provider
        in: path
        required: true
        description: "`github` or `google`"
        schema:
          type: string
      - name: redirect
        in: query
        required: false
        description: "The console path to return to"
        schema:
          type: string
      - name: reauth
        in: query
        required: false
        description: "Sign in again before a yes: the provider asks again"
        schema:
          type: boolean
      - name: redirect_uri
        in: query
        required: false
        description: "Mobile app: its deep link, exactly `ostrom://auth/callback`. With `state`, `code_challenge` and
          `code_challenge_method=S256`, the callback returns a one-time `code` (or an `error`) and the app's `state` to
          it; any invalid mobile parameter answers 400"
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: "Mobile app: its state, returned with the code"
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        description: "Mobile app: the S256 PKCE challenge (43 characters)"
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        description: "Mobile app: `S256` only"
        schema:
          type: string
      security: []
      responses:
        '302':
          description: "Redirect"
        '400':
          $ref: '#/components/responses/Error'
  /api/v1/auth/{provider}/callback:
    get:
      operationId: oauthLoginCallback
      x-ostrom-status: served
      tags:
      - auth
      summary: "Where the provider sends the browser back: sets the session cookies and redirects to the console (or to
        `/login?error=`). For a sign-in the phone app started, an error redirects to the app's deep link; a code is
        answered as a page whose link to the deep link the person taps"
      parameters:
      - name: provider
        in: path
        required: true
        description: "`github` or `google`"
        schema:
          type: string
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '200':
          description: "A mobile sign-in's code: the page that names who signed in and links to the app's deep link
            (`ostrom://auth/callback?code=&state=`), on the person's tap; no script, never framed or cached"
          content:
            text/html:
              schema:
                type: string
        '302':
          description: "Redirect"
  /api/v1/auth/{provider}/link:
    post:
      operationId: linkSignInProvider
      x-ostrom-status: served
      tags:
      - auth
      summary: "A signed-in person (browser session and `X-CSRF-Token`) starts linking a provider to their account: the answer
        gives the consent page to open, the state cookie is set, and the callback links the identity"
      parameters:
      - name: provider
        in: path
        required: true
        description: "`github` or `google`"
        schema:
          type: string
      - name: redirect
        in: query
        required: false
        description: "The console path to return to"
        schema:
          type: string
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkStarted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/device:
    get:
      operationId: getDeviceLogin
      x-ostrom-status: served
      tags:
      - auth
      summary: "The pending `ostrom login` the person is about to answer (browser session only)"
      parameters:
      - name: userCode
        in: query
        required: true
        description: "The code the CLI shows"
        schema:
          type: string
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorization'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: startDeviceLogin
      x-ostrom-status: served
      tags:
      - auth
      summary: Start the device flow (CLI sign-in)
      description: "Without a body, the ordinary sign-in of `ostrom login`. With `scopes`, `ostrom login --admin`: the
        governance write scopes no other token holds (S2-52, decision of 02/11/2026). The browser's page shows them
        (`DeviceAuthorization.scopes`), only an owner or admin of the organisation may approve them, and the token
        that comes out is bound to that organisation, expires in 8 hours at most and is never refreshed. Each
        governance write it makes is recorded in the organisation's audit log before it happens. A server older than
        this answers an ordinary token, whose `AuthToken.scopes` tell the CLI."
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLoginStart'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCode'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/device/token:
    post:
      operationId: pollDeviceLogin
      x-ostrom-status: served
      tags:
      - auth
      summary: Exchange a confirmed device code for a token (RFC 8628 section 3.5). 428 `authorization_pending` while
        nobody approved it yet (poll again after the interval); 400 `slow_down` (poll less often), `access_denied` (the
        sign-in was refused) or `expired_token` (the code expired or was used; start again), in `error.type`; 200 with
        the token once approved
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceCode:
                  type: string
              required:
              - deviceCode
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          description: '`error.type` is `slow_down`, `access_denied` or `expired_token` (RFC 8628), or the request is
            malformed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/Error'
        '428':
          description: '`error.type` is `authorization_pending`: not approved yet, poll again after the interval'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/device/answer:
    post:
      operationId: answerDeviceLogin
      x-ostrom-status: served
      description: "Approving an `ostrom login --admin` binds its token to an organization the person owns or
        administers. The organization is read after the recent sign-in check: the one `Ostrom-Org` names, else the
        person's only one. A person in several organizations names it, or gets 409 `org_required`. An `Ostrom-Org`
        value that is not the id of one of their organizations, an organization they belong to without owning or
        administering it, and a person in no organization are 403 `forbidden`, never 404. The ordinary `ostrom login`
        and a denial read no organization."
      tags:
      - auth
      summary: "Approve or deny an `ostrom login` (browser session only)"
      parameters:
      - name: Ostrom-Org
        in: header
        required: false
        description: The id of the organization an approved `ostrom login --admin` acts in. An option, read only for
          that approval; without it, the person's only organization
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAnswer'
      responses:
        '204':
          description: "Answered"
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: step_up_required (approving `ostrom login --admin` needs a sign-in less than 5 minutes old;
            sign in again, then answer again; a denial and the ordinary `ostrom login` are not asked for it), or
            forbidden (the key is `error.type`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpOrForbidden'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: org_required (approving `ostrom login --admin` without `Ostrom-Org`, for a person in several
            organizations)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/token/refresh:
    post:
      operationId: refreshToken
      x-ostrom-status: planned
      tags:
      - auth
      summary: Refresh a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/launcher/config:
    get:
      operationId: getLauncherConfig
      x-ostrom-status: planned
      tags:
      - auth
      summary: What the CLI needs to sign in (GitHub OAuth client id)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  githubClientId:
                    type: string
                required:
                - githubClientId
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/auth/launcher/login:
    post:
      operationId: launcherLogin
      x-ostrom-status: served
      tags:
      - auth
      summary: Exchange a GitHub token proven by the CLI for a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                githubToken:
                  type: string
                via:
                  type: string
              required:
              - githubToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  login:
                    type: string
                  token:
                    type: string
                  expiresAt:
                    type: string
                required:
                - login
                - token
                - expiresAt
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/launches:
    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    post:
      operationId: createLaunch
      x-ostrom-status: served
      description: "Scope `sessions:write` (the CLI's device token, a browser session). A person's only: an agent token
        never launches. The person and the organization come from the credential. 403 when the organization's policy
        refuses the agent or the model, or the credential may not launch; 404 when it is no member of an organization
        the request can act in."
      tags:
      - auth
      summary: 'Start an agent launch: returns an agent token scoped to the sessions of this launch, expiring at its end.
        The device token never enters the agent environment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repo:
                  type: string
                agent:
                  type: string
                model:
                  type: string
              required:
              - agent
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  launchId:
                    type: string
                  agentToken:
                    type: string
                  expiresAt:
                    type: string
                required:
                - launchId
                - agentToken
                - expiresAt
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/launches/{launchId}:
    delete:
      operationId: endLaunch
      x-ostrom-status: served
      description: "The launch's own agent token only (AUDIT-SECU-RUNNER-2 R2b): `ostrom <agent>` calls it when the agent
        ends, and the token is revoked at once instead of living until `expiresAt`. Any other credential, another
        launch's agent token included, gets 404, the same answer as an unknown launch. Once ended, the token is refused
        with 401 everywhere, this operation included."
      tags:
      - auth
      summary: End a launch, revoking its agent token
      parameters:
      - name: launchId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/policy/agents:
    parameters:
    - $ref: '#/components/parameters/OstromOrg'
    get:
      operationId: checkAgentPolicy
      x-ostrom-status: served
      tags:
      - auth
      summary: May this developer launch this agent with this model
      parameters:
      - name: agent
        in: query
        required: false
        schema:
          type: string
      - name: dev
        in: query
        required: false
        schema:
          type: string
      - name: model
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
