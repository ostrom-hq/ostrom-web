      summary: "Add an item found on the way"
      description: "Marked `discovered` with its `reason`, placed after the item in progress and after its own
        dependencies. The same 400 keys as the creation; 404 `todo_not_found` without a list; 409 `todo_closed` when
        the list is done or abandoned. Callers: the session's agent token (the token of its launch), confined to its
