    ArtifactType:
      type: string
      enum:
      - skill
      - context
      - hook
      - script
      - mcp
      - approval
      - notify
      - subagent
      - receipt
    ArtifactVersion:
      type: object
      description: A version of an artifact
      properties:
        number:
          type: integer
        files:
          type: array
          items:
            type: string
        entry:
          type: string
          description: The page a reader opens first
        createdAt:
          type: string
        createdBy:
          type: string
      required:
      - number
      - files
      - entry
      - createdAt
      - createdBy
      x-ostrom-kotlin: pending
    AuditEvent:
      type: object
