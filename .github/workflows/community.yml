name: Community

# Pull request title, DCO, SPDX headers and workflow security (zizmor), in one job named `community`, on pull
# requests only and never on drafts (org CI rule). Links are checked weekly by links.yml.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: community-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The title becomes the squash commit on main and the changelog line: it must be a Conventional Commit.
      # GitHub's revert button titles a pull request 'Revert "<original title>"': accepted as is.
      - name: Pull request title
        if: ${{ !startsWith(github.event.pull_request.title, 'Revert "') }}
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          requireScope: false
          subjectPattern: ^(?![A-Z][a-z]).+$
          subjectPatternError: >-
            The subject "{subject}" must not start with a capitalized word ("Add ..."): write "feat(cli): add ostrom doctor". Acronyms (API, CLI) are fine.

      - name: Developer Certificate of Origin
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          # Maintainers (write access or more) have signed the DCO once for all; bots do not hold copyright.
          # The permission is read from the API: author_association says CONTRIBUTOR for a private org membership.
          if [ "$AUTHOR_TYPE" = "Bot" ]; then echo "dco: bot author"; exit 0; fi
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in admin|maintain|write) echo "dco: $AUTHOR is a maintainer ($perm)"; exit 0;; esac
          missing=0
          while IFS=$'\t' read -r sha email msg; do
            if ! printf '%s' "$msg" | base64 -d | grep -i '^Signed-off-by: ' | grep -qiF "<$email>"; then
              echo "::error::commit ${sha:0:12} has no 'Signed-off-by: ... <$email>' line"
              missing=1
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate \
            --jq '.[] | select(.parents | length == 1) | [.sha, .commit.author.email, (.commit.message | @base64)] | @tsv')
          if [ "$missing" = 1 ]; then
            echo "Sign off with: git rebase --signoff origin/main && git push --force-with-lease (see CONTRIBUTING.md)"
            exit 1
          fi
          echo "dco: every commit is signed off"

      - name: License headers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 .github/scripts/check_spdx.py --base "$BASE"

      - name: Workflow security
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/
          min-severity: high
          advanced-security: false
