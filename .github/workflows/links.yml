name: Links

on:
  pull_request:
    paths: ['**/*.md', '**/*.mdx', '.lycheeignore', '.github/workflows/links.yml']
  push:
    branches: [main]
    paths: ['**/*.md', '**/*.mdx', '.lycheeignore', '.github/workflows/links.yml']
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --cache --max-cache-age 1d --max-retries 3 --accept 200,206,429
            --exclude-path node_modules --exclude-path CHANGELOG.md
            './**/*.md' './**/*.mdx'
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
