name: License headers

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  spdx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: SPDX headers and license files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then python3 .github/scripts/check_spdx.py --base "$BASE"
          else python3 .github/scripts/check_spdx.py; fi
