# A newer @ostrom-hq/openapi (the server's API document, published by ostrom-server's CI from main): a pull request
# moves `ostrom.openapi` in package.json to it and regenerates gen/api, so the console follows the server by review,
# never silently (ostrom-core docs/decisions/0001). One pull request at a time, on the branch openapi/bump.
name: API document version
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the branch openapi/bump
      pull-requests: write # its pull request
      packages: read # @ostrom-hq/openapi
    steps:
      # With the release App (variables RELEASE_APP_ID, secret RELEASE_APP_PRIVATE_KEY), the pull request starts the
      # CI like any other; with GITHUB_TOKEN it does not (close and reopen it), so the App is preferred.
      - name: Token of the release App
        id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: The newest published version
        id: version
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          printf '@ostrom-hq:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" \
            > "$RUNNER_TEMP/.npmrc"
          latest=$(npm view @ostrom-hq/openapi version --userconfig "$RUNNER_TEMP/.npmrc")
          pinned=$(node -p 'require("./package.json").ostrom.openapi')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "@ostrom-hq/openapi: pinned $pinned, newest $latest" >> "$GITHUB_STEP_SUMMARY"
      - name: Move the pin and regenerate gen/api
        if: steps.version.outputs.latest != steps.version.outputs.pinned
        env:
          LATEST: ${{ steps.version.outputs.latest }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const f="package.json",p=require("./"+f);p.ostrom.openapi=process.env.LATEST;require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")'
          pnpm install --frozen-lockfile
          pnpm gen:api
          pnpm exec prettier --write package.json
      - name: Open or update the pull request
        if: steps.version.outputs.latest != steps.version.outputs.pinned
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          LATEST: ${{ steps.version.outputs.latest }}
          PINNED: ${{ steps.version.outputs.pinned }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c openapi/bump
          git add package.json gen
          git commit -q -m "chore(api): @ostrom-hq/openapi $LATEST" -m "From $PINNED. Generated by the API document version workflow."
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" openapi/bump
          title="chore(api): @ostrom-hq/openapi $LATEST"
          body="Moves the server's API document from $PINNED to $LATEST and regenerates the client. Review the diff of gen/api: a removed or changed field is a contract change the console must follow."
          if [ -n "$(gh pr list --head openapi/bump --state open --json number -q '.[].number')" ]; then
            gh pr edit openapi/bump --title "$title" --body "$body"
          else
            gh pr create --head openapi/bump --title "$title" --body "$body"
          fi
