<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140E10" media="(prefers-color-scheme: dark)" />
    <title>Ostrom</title>
    <script>
      // Applies a pinned theme before the first paint (key and values: src/shared/theme/themeStore.ts).
      try {
        var pinned = window.localStorage.getItem('ostrom.theme');
        if (pinned === 'light' || pinned === 'dark') document.documentElement.dataset.theme = pinned;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
